name: LEPT Pair Publisher Tests and Publication Workflow Validation

on:
  push:
    branches: [main]
    paths:
      - 'python-engine/publish_lept_pair.py'
      - 'python-engine/tests/test_publish_lept_pair.py'
      - '.github/workflows/process-import.yml'
      - '.github/workflows/prc-lept-march-2026-live-retrieval.yml'
      - '.github/workflows/lept-pair-publisher-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python-engine/publish_lept_pair.py'
      - 'python-engine/tests/test_publish_lept_pair.py'
      - '.github/workflows/lept-pair-publisher-tests.yml'
      - '.github/workflows/prc-lept-march-2026-live-retrieval.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python engine dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Validate publication and live Worker workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "#{path}: OK" }' \\
            .github/workflows/process-import.yml \\
            .github/workflows/prc-lept-march-2026-live-retrieval.yml
      - name: Run atomic LEPT publisher tests
        run: PYTHONPATH=python-engine python -m unittest discover -s python-engine/tests -p 'test_publish_lept_pair.py' -v
