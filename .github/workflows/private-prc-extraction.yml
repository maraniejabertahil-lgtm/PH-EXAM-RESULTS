name: Private PRC Staging Extraction

on:
  push:
    branches:
      - fix/prc-private-layout-extraction
    paths:
      - .github/workflows/private-prc-extraction.yml
      - python-engine/config/prc-sources.json
      - tools/extract-prc-pdf.mjs
  workflow_dispatch:
    inputs:
      source_id:
        description: Exact enabled source ID from python-engine/config/prc-sources.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract-private:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PRC staging source registry and extractor
        uses: actions/checkout@v5
        with:
          ref: fix/prc-private-layout-extraction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PDF and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Validate extractor syntax and safety tests
        run: |
          python -m py_compile tools/prc-drive-acquire.py tools/prc-mirror-extract.py

      - name: Acquire and extract approved official PRC examination PDF
        env:
          SOURCE_ID: ${{ inputs.source_id || 'PRC-NLE-2026-08-09' }}
          SOURCE_REGISTRY: python-engine/config/prc-sources.json
          OUTPUT_DIR: private-prc-extraction
        run: |
          if python tools/prc-drive-acquire.py; then
            echo 'Official PDF acquired.'
          else
            echo 'Official PDF download unavailable; trying permitted public transcription mirrors.'
            python tools/prc-mirror-extract.py
          fi

      - name: Inspect original PDF layout when official bytes are available
        run: |
          set -euo pipefail
          pdf="private-prc-extraction/${{ inputs.source_id || 'PRC-NLE-2026-08-09' }}.pdf"
          if test -s "$pdf"; then
            pdfinfo "$pdf" > private-prc-extraction/pdfinfo.txt
            pdftotext -layout "$pdf" private-prc-extraction/poppler-layout.txt
            pdftotext -bbox-layout "$pdf" private-prc-extraction/poppler-bbox.html
          else
            echo "Official PDF bytes unavailable; original two-column layout remains unverified." > private-prc-extraction/layout-unavailable.txt
          fi

      - name: Upload private extraction evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-prc-extraction-evidence-${{ github.run_id }}
          path: private-prc-extraction/
          if-no-files-found: warn
          retention-days: 1

