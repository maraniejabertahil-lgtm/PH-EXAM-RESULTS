name: Initialize private D1 activity schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require D1 credentials without displaying them
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_D1_DATABASE_ID"
          test -n "$CF_D1_API_TOKEN"
          echo "D1 configuration is present."
      - name: Apply idempotent D1 schema using the Cloudflare REST API
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: PYTHONPATH=python-engine python -m database.apply_migrations
