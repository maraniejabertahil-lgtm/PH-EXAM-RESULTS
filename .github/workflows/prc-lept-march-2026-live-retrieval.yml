          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<title>playwright-ready</title>")
              assert page.title() == "playwright-ready"
              browser.close()
          PY

      - name: Build Secondary event from the live official PRC article
        env:
          RESULT_LEVEL: secondary
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { fetchOfficialArticleMetadata } from "./watcher-bot/src/index.js";
          import { buildReleaseEvent } from "./watcher-bot/src/release-event.js";

          const articleUrl = "https://prc.gov.ph/article/march-2026-licensure-examination-professional-teachers-results-released-thirty-nine-39";
          const expectedRosterUrl = "https://drive.google.com/file/d/1RFuFGN4D1T3hkGC-iib9pRmJP1vJiJJ7/view?usp=sharing";
          const article = await fetchOfficialArticleMetadata(articleUrl, fetch);
          const built = buildReleaseEvent(
            { id: "PRC-EXAM-RESULTS-HOMEPAGE", authority: "PRC" },
            article,
            { resultLevel: process.env.RESULT_LEVEL }
          );
          if (!built.ok) throw new Error("Official PRC LEPT article was not accepted: " + built.reason);
          if (built.event.exam_code !== "LEPT" || built.event.exam_year !== 2026 ||
              built.event.result_level !== "secondary" || built.event.announced_count !== 45001) {
            throw new Error("The Secondary LEPT event identity or announced count is wrong.");
          }
          if (built.event.content_urls.length !== 1 ||
              built.event.content_urls[0].url !== expectedRosterUrl) {
            throw new Error("The Watcher did not select only the official Secondary passer list.");
          }
          await writeFile("event.json", JSON.stringify(built.event, null, 2) + "\n", "utf8");
          console.log("Live PRC LEPT Secondary event passed: 45,001 announced passers and exact official roster link.");
          NODE

      - name: Prepare a temporary, test-only source registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          matches = [item for item in registry["sources"] if item.get("exam") == "LEPT-SECONDARY-2026"]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one isolated LEPT Secondary source entry.")
          source = matches[0]
          # Temporary test-only enablement; no production source setting is changed.
          # The engine still checks live robots.txt and verifies the exact official article link.
          source["enabled"] = True
          source["auto_acquire"] = True
          source["robots_policy_verified"] = True
          Path("test-sources.json").write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Preflight the reviewed LEPT record mapping
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          mappings = json.loads(Path("python-engine/config/adapter_mappings.json").read_text(encoding="utf-8"))
          mapping = mappings["LEPT:secondary:2026:public_preview"]
          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          source = next(item for item in registry["sources"] if item.get("exam") == "LEPT-SECONDARY-2026")
          if not source["public_preview"]["page_control_selector"].endswith(":visible"):
              raise SystemExit("LEPT viewer page control must target the visible input.")
          match = re.fullmatch(mapping["record_pattern"], "1 AALA, ROSARIO FABELLAR")
          if not match or match.group("sequence") != "1" or match.group("name") != "AALA, ROSARIO FABELLAR":
              raise SystemExit("LEPT mapping does not match the visible official roster line.")
          print("LEPT mapping preflight passed.")
          PY

      - name: Acquire all public-viewer pages and run Greenlight
        run: |
          python3 python-engine/prc_orchestrator.py \
            --event event.json \
            --out prc-lept-secondary-output \
            --source-registry test-sources.json \
            --adapter-mappings python-engine/config/adapter_mappings.json

      - name: Verify all 45,001 Secondary passer records without publishing
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          output = Path("prc-lept-secondary-output")
          report = json.loads((output / "report.json").read_text(encoding="utf-8"))
          batch = json.loads((output / "release-batch.json").read_text(encoding="utf-8"))
          capture_dir = output / "public-preview-capture"
          records_path = capture_dir / "records.jsonl"
          records = [json.loads(line) for line in records_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          expected_count = 45001
          if report.get("status") != "ready_for_greenlight_pipeline":
              raise SystemExit("Retrieval did not reach ready state: " + str(report.get("status")))
          if report.get("records") != expected_count or report.get("greenlight") != 100:
              raise SystemExit("The Python engine did not validate all 45,001 Secondary passer records.")
          if batch.get("announced_count") != expected_count or batch.get("level") != "secondary":
              raise SystemExit("The batch does not preserve the official Secondary announced count and level.")
          if batch.get("official_content_mode") != "public_preview_capture":
              raise SystemExit("The approved ordinary public preview was not used.")
          if report.get("published") is not False:
              raise SystemExit("This retrieval-only acceptance workflow must never publish.")
          if len(records) != expected_count:
              raise SystemExit("Expected 45,001 passer names; found " + str(len(records)) + ".")
          sequences = [int(item["seq"]) for item in records]
          if sequences != list(range(1, expected_count + 1)):
              raise SystemExit("Passer sequence numbers have a gap, duplicate, or ordering error.")
          names = [item["name"].strip() for item in records]
          if any(not name or "," not in name for name in names):
              raise SystemExit("A passer name is blank or does not match the reviewed roster format.")
          if len({" ".join(name.split()).casefold() for name in names}) != expected_count:
              raise SystemExit("Duplicate passer names were found.")
          capture_manifest = json.loads((capture_dir / "viewer-capture-manifest.json").read_text(encoding="utf-8"))
          if capture_manifest.get("page_coverage_complete") is not True:
              raise SystemExit("The public viewer capture did not cover every page.")
          if capture_manifest.get("pdf_downloaded") is not False or capture_manifest.get("access_controls_bypassed") is not False:
              raise SystemExit("The retrieval must not download the PDF or bypass access controls.")

          payload = {
              "authority": "PRC", "exam": "LEPT", "level": "secondary", "year": 2026,
              "official_article_url": batch["official_article_url"],
              "official_content_url": batch["official_content_url"],
              "announced_count": expected_count,
              "records": [{"sequence_number": str(item["seq"]), "name": item["name"]} for item in records],
          }
          (output / "passer-list.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with (output / "passer-list.csv").open("w", newline="", encoding="utf-8-sig") as stream:
              writer = csv.DictWriter(stream, fieldnames=["sequence_number", "name"])
              writer.writeheader()
              writer.writerows({"sequence_number": str(item["seq"]), "name": item["name"]} for item in records)

          acceptance = {
              "status": "PASS", "authority": "PRC", "exam": "LEPT", "level": "secondary", "year": 2026,
              "announced_count": expected_count, "retrieved_count": len(records),
              "greenlight_score": report["greenlight"],
              "viewer_pages_expected": capture_manifest["viewer_pages_expected"],
              "viewer_pages_captured": capture_manifest["viewer_pages_captured"],
              "official_article_url": batch["official_article_url"],
              "official_content_url": batch["official_content_url"],
              "published": False, "pdf_downloaded": False, "access_controls_bypassed": False,
          }
          (output / "retrieval-acceptance.json").write_text(json.dumps(acceptance, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Live PRC LEPT Secondary passer retrieval: PASS\n\n"
                  "- Retrieved passer names: **45,001 / 45,001**\n"
                  "- Viewer pages: all pages confirmed by the capture manifest\n"
                  "- Sequence coverage: **1–45,001, complete**\n"
                  "- Greenlight: **100%**\n"
                  "- PDF download: no; access-control bypass: no\n"
                  "- Publication: **not performed**\n"
              )
          print("LIVE RETRIEVAL PASS: 45,001 LEPT Secondary names; Greenlight 100; not published.")
          PY


      - name: Build structured dataset, verify production D1, and prepare website preview
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          EXPECTED_NAME: "AALA, ROSARIO FABELLAR"
          EXPECTED_SEQUENCE: "1"
          SEARCH_QUERY: "AALA"
          EXPECTED_COUNT: "45001"
        run: |
          set -euo pipefail
          # Enable only the allowlisted sources inside this disposable runner.
          # The committed production registry remains disabled until Owner approval.
          cp test-sources.json python-engine/config/sources.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, "python-engine")
          from main import process_batch, _build_public_catalog
          from database.d1_client import D1Client

          output = Path("prc-lept-secondary-output")
          batch_path = output / "release-batch.json"
          batch_bytes = batch_path.read_bytes()
          batch = json.loads(batch_bytes)
          expected = int(os.environ["EXPECTED_COUNT"])
          processed = process_batch(batch_path, root=Path.cwd())
          report = processed["report"]
          manifest = processed["manifest"]
          if report.get("greenlight_score") != 100 or report.get("record_count") != expected:
              raise SystemExit("Dataset processing did not pass Greenlight with the complete official count.")
          if manifest.get("record_count") != expected or manifest.get("announced_count") != expected:
              raise SystemExit("Structured dataset manifest count does not match the official announcement.")
          if manifest.get("exam") != batch.get("exam") or manifest.get("year") != batch.get("year"):
              raise SystemExit("Structured dataset identity does not match the official release batch.")

          # Confirm that this real production processing run wrote event rows and
          # the import-batch result to Cloudflare D1. No examinee names are stored.
          client = D1Client.from_env()
          if client is None:
              raise SystemExit("Production D1 credentials are missing; database verification cannot pass.")
          execution_id = (
              "python:" + os.environ["GITHUB_RUN_ID"] + ":" +
              hashlib.sha256(str(batch_path).encode()).hexdigest()[:12]
          )
          events = client.query(
              "SELECT event_type, status FROM monitoring_logs WHERE execution_id = ?",
              [execution_id],
          )
          event_types = {row.get("event_type") for row in events}
          if not {"processing_started", "greenlight_passed"}.issubset(event_types):
              raise SystemExit("Production D1 is missing the processing-started or Greenlight-passed event.")
          batch_id = hashlib.sha256(batch_bytes).hexdigest()
          batches = client.query(
              "SELECT status, greenlight_score, announced_count, extracted_count FROM import_batches WHERE batch_id = ?",
              [batch_id],
          )
          if len(batches) != 1:
              raise SystemExit("Production D1 did not retain exactly one row for this result batch.")
          saved = batches[0]
          if (
              saved.get("status") != "greenlight_passed"
              or saved.get("greenlight_score") != 100
              or saved.get("announced_count") != expected
              or saved.get("extracted_count") != expected
          ):
              raise SystemExit("Production D1 import-batch values do not match the verified result set.")

          # Build an isolated static website preview. It is not deployed.
          preview_repo = Path("website-preview")
          preview_public = preview_repo / "public"
          shutil.copytree(Path("public"), preview_public, dirs_exist_ok=True)
          destination = preview_public / "data" / "PRC" / batch["exam"] / str(batch["year"])
          destination.mkdir(parents=True, exist_ok=True)
          for artifact in Path(processed["dataset_dir"]).iterdir():
              if artifact.is_file():
                  shutil.copy2(artifact, destination / artifact.name)
          catalog = _build_public_catalog(
              preview_repo,
              authority=batch["authority"],
              exam=batch["exam"],
              year=batch["year"],
              manifest=manifest,
          )
          (preview_public / "data" / "catalog.json").write_bytes(catalog)

          # Test the real website code against the temporary preview.
          from playwright.sync_api import sync_playwright
          server = subprocess.Popen(
              [sys.executable, "-m", "http.server", "8765", "--directory", str(preview_public)],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          try:
              time.sleep(1)
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto("http://127.0.0.1:8765/", wait_until="networkidle", timeout=60000)
                  page.wait_for_function(
                      "() => document.querySelector('#authority')?.options.length > 1",
                      timeout=30000,
                  )
                  page.select_option("#authority", "PRC")
                  page.wait_for_function(
                      "(exam) => Array.from(document.querySelector('#exam').options).some(o => o.value === exam)",
                      arg=batch["exam"],
                      timeout=30000,
                  )
                  page.select_option("#exam", batch["exam"])
                  page.wait_for_function(
                      "() => document.querySelector('#year')?.options.length > 1",
                      timeout=30000,
                  )
                  page.select_option("#year", str(batch["year"]))
                  page.fill("#name-query", os.environ["SEARCH_QUERY"])
                  page.click("#search-button")
                  page.wait_for_function(
                      "() => document.querySelector('#status-message')?.textContent.includes('Search complete')",
                      timeout=60000,
                  )
                  names = page.locator("#results-list .result-name")
                  sequences = page.locator("#results-list .sequence")
                  found = False
                  for index in range(min(names.count(), 100)):
                      name = names.nth(index).inner_text().strip()
                      sequence = sequences.nth(index).inner_text().strip()
                      if name == os.environ["EXPECTED_NAME"] and sequence == "Sequence " + os.environ["EXPECTED_SEQUENCE"]:
                          found = True
                          break
                  if not found:
                      raise SystemExit("Website preview did not return the expected official name and sequence.")
                  page.screenshot(path="website-preview-check.png", full_page=True)
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=10)

          preview_report = {
              "status": "PASS",
              "mode": "LOCAL_STATIC_PREVIEW_NOT_DEPLOYED",
              "authority": batch["authority"],
              "exam": batch["exam"],
              "year": batch["year"],
              "record_count": manifest["record_count"],
              "greenlight_score": report["greenlight_score"],
              "production_d1": "PASS",
              "website_search": "PASS",
              "known_record": {
                  "name": os.environ["EXPECTED_NAME"],
                  "sequence_number": os.environ["EXPECTED_SEQUENCE"],
              },
              "published": False,
          }
          Path("website-preview/preview-acceptance.json").write_text(
              json.dumps(preview_report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(preview_report, ensure_ascii=False, indent=2))
          PY

      - name: Prepare the exact Owner visual-review bundle
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "python-engine")
          from create_review_bundle import create_review_bundle
          output = Path("prc-lept-secondary-output")
          bundle = create_review_bundle(
              output / "release-batch.json",
              output / "owner-review-bundle.json",
              root=Path.cwd(),
          )
          print(
              "Owner review bundle prepared:",
              bundle["record_count"], "records;",
              len(bundle["evidence"]), "screenshot evidence items;",
              "candidate SHA-256", bundle["candidate_sha256"],
          )
          PY

      - name: Preserve passer list, dataset, preview, and evidence
        if: always() && hashFiles('prc-lept-secondary-output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prc-lept-secondary-passer-retrieval-${{ github.run_id }}
          path: |
            prc-lept-secondary-output/
            event.json
            test-sources.json
            python-engine/artifacts/
            website-preview/
            website-preview-check.png
          if-no-files-found: error
          retention-days: 7

  verify-production-watcher:
    name: Verify the deployed production PRC Watcher
    needs:
      - retrieve-elementary-passers
      - retrieve-secondary-passers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the live Worker and its fresh official PRC schedule response
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          if not token or not account:
              raise SystemExit("Production Cloudflare credentials are missing.")
          request = Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
          )
          with urlopen(request, timeout=20) as response:
              subdomain_payload = json.load(response)
          if subdomain_payload.get("success") is not True:
              raise SystemExit("Cloudflare could not confirm the account Workers subdomain.")
          subdomain = subdomain_payload.get("result", {}).get("subdomain")
          if not isinstance(subdomain, str) or not subdomain:
              raise SystemExit("Cloudflare Workers subdomain is missing.")
          worker_url = f"https://ph-exam-results-watcher.{subdomain}.workers.dev/api/releases/upcoming"
          request = Request(worker_url, headers={"Accept": "application/json"})
          with urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"Production Watcher returned HTTP {response.status}.")
              payload = json.load(response)
          if payload.get("ok") is not True or payload.get("authority") != "PRC":
              raise SystemExit("Production Watcher did not return a valid official PRC schedule.")
          access = payload.get("access_policy")
          if not isinstance(access, dict) or access.get("outcome") != "allowed":
              raise SystemExit("Production Watcher did not provide an allowed robots-policy result.")
          fetched = payload.get("fetched_at")
          if not isinstance(fetched, str):
              raise SystemExit("Production Watcher schedule has no fetch timestamp.")
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(fetched.replace("Z", "+00:00"))).total_seconds()
          if age < 0 or age > 150:
              raise SystemExit("Production Watcher schedule snapshot is not fresh.")
          print(json.dumps({
              "status": "PASS",
              "worker": "ph-exam-results-watcher",
              "endpoint": "/api/releases/upcoming",
              "authority": payload["authority"],
              "access_policy": access["outcome"],
              "schedule_snapshot_age_seconds": round(age, 1),
          }, indent=2))
          PY
