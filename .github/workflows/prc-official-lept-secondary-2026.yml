name: PRC Official LEPT Secondary Extraction Trial

on:
  push:
    branches:
      - integration/prc-public-preview-secondary
    paths:
      - "tools/prc-official-lept-secondary-2026.py"
      - "tools/prototypes/prc_secondary_preview_ocr_probe.py"
      - "tools/run_prc_public_preview_python_engine_secondary.py"
      - "python-engine/**"
      - ".github/workflows/prc-official-lept-secondary-2026.yml"

concurrency:
  group: prc-official-lept-secondary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Six-way capture matrix; matrix expressions below are native GitHub Actions expressions.
  SHARDS: 4

jobs:
  capture:
    name: capture-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium only
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture this shard of the official public preview
        run: python tools/prc-official-lept-secondary-2026.py --shard ${{ matrix.shard }} --shards ${{ env.SHARDS }}
      - name: Upload shard capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prc-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

  merge:
    name: merge-validate-greenlight
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download all shard captures
        uses: actions/download-artifact@v4
        with:
          pattern: prc-shard-*
          merge-multiple: true
          path: shard-output
      - name: Install Python Engine, browser, and OCR requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r python-engine/requirements.txt playwright pillow
          python -m playwright install --with-deps chromium
      - name: Merge shards, parse and validate official public preview
        run: python tools/prc-official-lept-secondary-2026.py --merge --shards ${{ env.SHARDS }}
      - name: Capture first and last records from the official viewer
        run: python tools/prototypes/prc_secondary_preview_ocr_probe.py
      - name: Run Python Engine Greenlight and local dataset generation
        run: python tools/run_prc_public_preview_python_engine_secondary.py
      - name: Preserve Secondary extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prc-official-lept-secondary-2026-evidence
          path: |
            official-prc-secondary-evidence/
            official-prc-secondary-visual-check/
            python-engine/artifacts/
          if-no-files-found: warn
          retention-days: 7
