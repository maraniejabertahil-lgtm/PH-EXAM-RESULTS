name: Phase 5 End-to-End Safety Simulation
on:
  pull_request:
    branches: [Winner-Candidate]
    paths:
      - "python-engine/**"
      - "public/**"
      - "watcher-bot/**"
      - "tests/**"
      - ".github/workflows/phase5-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Compile Python engine
        run: python -m compileall -q python-engine
      - name: Run Python engine regression and dummy-input tests
        working-directory: python-engine
        run: PYTHONPATH=retrieval python -m unittest discover -s tests -v
      - name: Run browser dataset and large-search tests
        run: |
          node tests/loader-validation.test.mjs
          node tests/search-worker.test.mjs
      - name: Run Watcher tests
        working-directory: watcher-bot
        run: npm test
