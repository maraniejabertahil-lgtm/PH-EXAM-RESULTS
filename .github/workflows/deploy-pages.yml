name: Deploy Cloudflare Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "tools/validate_public_datasets.py"
      - "tools/check_public_secrets.py"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site and same-origin protected Owner dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install public dataset validation dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Validate required static routes and Pages Function
        run: |
          test -f public/index.html
          test -f public/preparing.html
          test -f public/review.html
          test -f public/404.html
          test -f public/_headers
          test -f public/status.json
          test -f public/data/catalog.json
          test -f public/assets/js/app.mjs
          test -f public/assets/js/storage.mjs
          test -f public/assets/js/search-worker.mjs
          test -f public/assets/js/review.mjs
          test -f functions/auth/firebase.js
          test -f functions/auth/health.js
          test -f functions/_middleware.js
          test -f functions/lib/access.js
          test -f functions/lib/firebase.js
          test -f functions/auth/firebase/complete.js
          test -f functions/auth/session.js
          test -f functions/auth/logout.js
          test -f functions/api/activity.js
          test -f functions/api/analytics.js
          test -f functions/api/test-runs.js
          test -f functions/api/test-runs/[runId].js
          test -f functions/api/test-mode/events.js
          test -f public/owner/index.html
          test -f public/owner/activity.js
          test -f public/owner/owner.css
      - name: Validate JavaScript module syntax
        run: |
          node --check public/assets/js/storage.mjs
          node --check public/assets/js/search-worker.mjs
          node --check public/assets/js/app.mjs
          node --check public/assets/js/review-logic.mjs
          node --check public/assets/js/review.mjs
          node --check functions/auth/firebase.js
          node --check functions/auth/health.js
          node --check functions/_middleware.js
          node --check functions/lib/access.js
          node --check functions/lib/firebase.js
          node --check functions/auth/firebase/complete.js
          node --check functions/auth/session.js
          node --check functions/auth/logout.js
          node --check functions/api/activity.js
          node --check functions/api/analytics.js
          node --check functions/api/test-runs.js
          node --check 'functions/api/test-runs/[runId].js'
          node --check functions/api/test-mode/events.js
          node --check public/owner/activity.js
      - name: Test same-origin Firebase Owner authentication and authorization
        run: node --test functions/tests/*.test.mjs
      - name: Run browser-side module tests
        run: node --test public/tests/*.test.mjs
      - name: Build Cloudflare Pages Functions bundle
        run: npx --yes wrangler@4.156.2 pages functions build functions --outdir /tmp/ph-exam-results-pages-functions --build-output-directory public
      - name: Validate committed public datasets
        run: python tools/validate_public_datasets.py
      - name: Scan published assets for common credential formats
        run: python tools/check_public_secrets.py

  deploy:
    name: Deploy public/ and root Pages Functions to Cloudflare Pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out the exact main-branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate Cloudflare Pages deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CF_PAGES_API_TOKEN (Cloudflare Pages:Edit token)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CF_ACCOUNT_ID."; exit 1; }
          test -n "$PROJECT_NAME" || { echo "::error::Missing Cloudflare Pages project name."; exit 1; }
          test -f public/index.html || { echo "::error::public/index.html is missing."; exit 1; }
          test -f functions/auth/firebase.js || { echo "::error::same-origin Firebase Owner authentication is missing."; exit 1; }
          echo "Cloudflare Pages deployment settings are present."

      - name: Verify same-origin Owner production variables are configured before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project = os.environ["PROJECT_NAME"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}"
          request = Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("success") is not True:
              raise SystemExit("Could not inspect public Pages production settings.")
          result = payload.get("result") or {}
          deployment_configs = result.get("deployment_configs") or {}
          production = deployment_configs.get("production") or {}
          configured = production.get("env_vars") or {}
          required = {
              "FIREBASE_PROJECT_ID", "FIREBASE_API_KEY", "PUBLIC_SITE_ORIGIN",
              "OWNER_EMAIL", "SESSION_SIGNING_KEY", "CF_ACCOUNT_ID",
              "CF_D1_DATABASE_ID", "CF_D1_READ_API_TOKEN",
          }
          if not isinstance(configured, dict):
              raise SystemExit(
                  "Cloudflare returned an unexpected Production env_vars structure "
                  f"(type={type(configured).__name__}); no values were logged."
              )
          missing = sorted(required - set(configured))
          if missing:
              raise SystemExit(
                  "Configure these production variables on the public Pages project before deploying: "
                  + ", ".join(missing)
              )

          secret_names = {"FIREBASE_API_KEY", "SESSION_SIGNING_KEY", "CF_D1_READ_API_TOKEN"}
          diagnostics = {}
          for name in sorted(secret_names):
              entry = configured.get(name)
              if isinstance(entry, dict):
                  diagnostics[name] = {
                      "type": entry.get("type"),
                      "entry_keys": sorted(entry.keys()),
                      "value_field_present": "value" in entry,
                      "value_field_type": type(entry.get("value")).__name__ if "value" in entry else None,
                  }
              else:
                  diagnostics[name] = {
                      "entry_type": type(entry).__name__,
                      "is_null": entry is None,
                  }
          print("Sanitized Cloudflare configuration diagnostics (secret values omitted):")
          print(json.dumps({
              "project_name": project,
              "production_config_keys": sorted(production.keys()),
              "deployment_config_environments": sorted(deployment_configs.keys()),
              "production_env_vars_container_type": type(configured).__name__,
              "secret_metadata": diagnostics,
          }, sort_keys=True))

          insecure = sorted(
              name for name in secret_names
              if not isinstance(configured.get(name), dict)
              or configured[name].get("type") != "secret_text"
          )
          if insecure:
              raise SystemExit(
                  "Cloudflare API did not report these Production variables as secret_text: "
                  + ", ".join(insecure)
                  + ". Review the sanitized metadata above; no secret values were read or printed."
              )
          from urllib.parse import urlsplit

          origin = configured["PUBLIC_SITE_ORIGIN"]
          origin_value = origin.get("value") if isinstance(origin, dict) else None
          origin_text = origin_value if isinstance(origin_value, str) else ""
          parsed_origin = urlsplit(origin_text) if origin_text else None
          origin_diagnostics = {
              "entry_type": type(origin).__name__,
              "entry_keys": sorted(origin.keys()) if isinstance(origin, dict) else [],
              "configured_type": origin.get("type") if isinstance(origin, dict) else None,
              "value_field_present": isinstance(origin, dict) and "value" in origin,
              "value_field_type": type(origin_value).__name__,
              "value_length": len(origin_text) if isinstance(origin_value, str) else None,
              "exact_expected_value": origin_value == "https://ph-exam-results.pages.dev",
              "has_leading_or_trailing_whitespace": bool(origin_text) and origin_text != origin_text.strip(),
              "has_trailing_slash": origin_text.endswith("/"),
              "uses_https": parsed_origin.scheme == "https" if parsed_origin else False,
              "expected_host": parsed_origin.netloc == "ph-exam-results.pages.dev" if parsed_origin else False,
          }
          print("Sanitized PUBLIC_SITE_ORIGIN diagnostics (configured value omitted):")
          print(json.dumps(origin_diagnostics, sort_keys=True))
          if (
              not isinstance(origin, dict)
              or origin.get("type") != "plain_text"
              or origin_value != "https://ph-exam-results.pages.dev"
          ):
              raise SystemExit(
                  "PUBLIC_SITE_ORIGIN must be plain_text and exactly "
                  "https://ph-exam-results.pages.dev; review sanitized diagnostics above."
              )
          print("All required same-origin Owner settings are present; secret values were not read or printed.")
          PY

      - name: Upload the current public/ directory and root Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.2 pages deploy public \
            --project-name "$PROJECT_NAME" \
            --branch main

      - name: Verify same-origin Owner authentication and protected dashboard
        env:
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test "$PROJECT_NAME" = "ph-exam-results" || {
            echo "::error::CF_PAGES_PROJECT_NAME must be ph-exam-results because the configured public origin is https://ph-exam-results.pages.dev."
            exit 1
          }
          base="https://${PROJECT_NAME}.pages.dev"
          ready="false"
          status="000"
          for attempt in $(seq 1 18); do
            status=$(curl --connect-timeout 5 --max-time 10 -sS \
              -o /tmp/public-owner-auth-health.json -w "%{http_code}" \
              "$base/auth/health" || true)
            if test "$status" = "200" && python -c 'import json; assert json.load(open("/tmp/public-owner-auth-health.json")) == {"ready": True}' 2>/dev/null; then
              ready="true"
              echo "Same-origin Firebase Owner authentication readiness passed."
              break
            fi
            sleep 5
          done
          test "$ready" = "true" || {
            echo "::error::Same-origin Owner authentication is not ready (HTTP $status). Configure required Firebase and D1 variables on the public Pages project."
            cat /tmp/public-owner-auth-health.json 2>/dev/null || true
            exit 1
          }

      - name: Verify Owner dashboard denies unauthenticated requests
        env:
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          base="https://${PROJECT_NAME}.pages.dev"
          status=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w "%{http_code}" "$base/owner/" || true)
          test "$status" = "302" || {
            echo "::error::Unauthenticated /owner/ must redirect to login (expected HTTP 302, got $status)."
            exit 1
          }
          curl --connect-timeout 5 --max-time 10 -sS -D /tmp/owner-dashboard-headers.txt -o /dev/null "$base/owner/"
          location=$(awk 'tolower($1)=="location:" && !found {sub(/\r$/, "", $2); print $2; found=1}' /tmp/owner-dashboard-headers.txt)
          case "$location" in *"?owner=login"*) echo "Unauthenticated Owner route is protected." ;; *) echo "::error::Owner route redirect did not target login."; exit 1 ;; esac
