name: Deploy Cloudflare Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "python-engine/database/**"
      - ".github/workflows/record-workflow-activity.yml"
      - ".github/workflows/migrate-d1-monitoring.yml"
      - "tools/validate_public_datasets.py"
      - "tools/check_public_secrets.py"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "python-engine/database/**"
      - ".github/workflows/record-workflow-activity.yml"
      - ".github/workflows/migrate-d1-monitoring.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site and public datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install public dataset validation dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Validate required static routes
        run: |
          test -f public/index.html
          test -f public/owner-monitor/index.html
          test -f public/_routes.json
          test -f public/preparing.html
          test -f public/review.html
          test -f public/404.html
          test -f public/_headers
          test -f public/status.json
          test -f public/data/catalog.json
          test -f public/assets/js/app.mjs
          test -f public/assets/js/storage.mjs
          test -f public/assets/js/search-worker.mjs
          test -f public/assets/js/review.mjs
      - name: Validate JavaScript module syntax
        run: |
          node --check public/assets/js/storage.mjs
          node --check public/assets/js/search-worker.mjs
          node --check public/assets/js/app.mjs
          node --check public/assets/js/owner-monitor.mjs
          node --check public/assets/js/review-logic.mjs
          node --check public/assets/js/review.mjs
      - name: Run browser-side module tests
        run: node --test public/tests/*.test.mjs
      - name: Test private owner-monitor Pages Functions
        run: node --test functions/tests/*.test.mjs
      - name: Build Pages Functions bundle
        run: npx --yes wrangler@4.156.2 pages functions build functions --outdir /tmp/ph-exam-pages-functions --project-directory .
      - name: Audit merge compatibility against every repository branch
        env:
          FEATURE_BRANCH: feature/private-activity-monitor-rebased-20261107
        run: python tools/check_all_branch_compatibility.py
      - name: Validate committed public datasets
        run: python tools/validate_public_datasets.py
      - name: Scan published assets for common credential formats
        run: python tools/check_public_secrets.py

  deploy:
    name: Deploy public/ to Cloudflare Pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out the exact main-branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate Cloudflare Pages deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CF_PAGES_API_TOKEN (Cloudflare Pages:Edit token)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CF_ACCOUNT_ID."; exit 1; }
          test -n "$PROJECT_NAME" || { echo "::error::Missing Cloudflare Pages project name."; exit 1; }
          test -f public/index.html || { echo "::error::public/index.html is missing."; exit 1; }
          echo "Cloudflare Pages deployment settings are present."

      - name: Upload the current public/ directory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.2 pages deploy public \
            --project-name "$PROJECT_NAME" \
            --branch main
