name: Deploy Private Owner Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "owner-dashboard/**"
      - "python-engine/database/**"
      - "python-engine/main.py"
      - "python-engine/prc_orchestrator.py"
      - "python-engine/acquisition/static_png_ocr.py"
      - "python-engine/config/static_png_ocr_mappings.json"
      - "python-engine/tests/test_static_png_ocr.py"
      # Core Python processing changes also require the all-branch merge audit.
      - "watcher-bot/**"
      - "tools/check_all_branch_compatibility.py"
      - ".github/workflows/deploy-owner-dashboard.yml"
      - ".github/workflows/record-workflow-activity.yml"
      - ".github/workflows/migrate-d1-monitoring.yml"
  push:
    branches:
      - main
    paths:
      - "owner-dashboard/**"
      - ".github/workflows/deploy-owner-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-owner-dashboard-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate private dashboard and D1 integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check private dashboard JavaScript syntax
        run: |
          node --check owner-dashboard/public/activity.js
          node --check owner-dashboard/public/continue.js
          node --check public/assets/js/app.mjs
          node --check owner-dashboard/functions/api/activity.js
          node --check owner-dashboard/functions/lib/access.js
          node --check owner-dashboard/functions/lib/firebase.js
          node --check owner-dashboard/functions/_middleware.js
          node --check owner-dashboard/functions/auth/firebase.js
          node --check owner-dashboard/functions/auth/firebase/complete.js
          node --check owner-dashboard/functions/lib/oauth.js
          node --check owner-dashboard/functions/auth/login.js
          node --check owner-dashboard/functions/auth/callback.js
          node --check owner-dashboard/functions/auth/session.js
          node --check owner-dashboard/functions/auth/logout.js
          node --check owner-dashboard/functions/auth/health.js
      - name: Test Firebase/GitHub dual Owner verification and private D1 API
        run: node --test owner-dashboard/functions/tests/*.test.mjs
      - name: Test public browser error messaging
        run: node --test public/tests/*.test.mjs
      - name: Test Python D1 REST client and additive migration
        working-directory: python-engine
        run: python -m unittest discover -s tests -p "test_d1_client.py" -v
      - name: Test GitHub workflow activity logger and D1 persistence failure handling
        working-directory: python-engine
        run: python -m unittest discover -s tests -p "test_log_github_run.py" -v
      - name: Compile Python metadata modules
        run: python -m py_compile python-engine/main.py python-engine/prc_orchestrator.py python-engine/database/*.py
      - name: Audit merge compatibility against every repository branch
        env:
          FEATURE_BRANCH: ${{ github.head_ref || 'main' }}
          BRANCH_COMPATIBILITY_STRICT: "1"
        run: python tools/check_all_branch_compatibility.py

  deploy:
    name: Deploy isolated private Pages project
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CF_OWNER_DASHBOARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify private Pages deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_OWNER_PAGES_PROJECT_NAME }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CF_PAGES_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CF_ACCOUNT_ID."; exit 1; }
          test -n "$PROJECT_NAME" || { echo "::error::Missing CF_OWNER_PAGES_PROJECT_NAME."; exit 1; }
          test -n "$CF_D1_API_TOKEN" || { echo "::error::Missing CF_D1_API_TOKEN."; exit 1; }
          test -n "$CF_D1_DATABASE_ID" || { echo "::error::Missing CF_D1_DATABASE_ID."; exit 1; }
          echo "Private Pages and D1 deployment settings are present."
      - name: Secure production Pages secrets and verify required variable names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_OWNER_PAGES_PROJECT_NAME }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project = os.environ["PROJECT_NAME"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}"

          def api(method, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = Request(
                  url, data=data, method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit("Cloudflare Pages configuration API request failed.")
              return payload.get("result", {})

          project_data = api("GET")
          production = project_data.get("deployment_configs", {}).get("production", {})
          configured = production.get("env_vars") or {}
          required = {
              "FIREBASE_PROJECT_ID", "FIREBASE_API_KEY", "PUBLIC_SITE_ORIGIN",
              "OWNER_EMAIL", "OWNER_GITHUB_ID", "GITHUB_OAUTH_CLIENT_ID",
              "GITHUB_OAUTH_CLIENT_SECRET", "SESSION_SIGNING_KEY",
              "CF_ACCOUNT_ID", "CF_D1_DATABASE_ID", "CF_D1_READ_API_TOKEN",
          }
          missing = sorted(required - set(configured))
          if missing:
              raise SystemExit("Missing required production Pages variable names: " + ", ".join(missing))

          secret_names = {
              "FIREBASE_API_KEY", "GITHUB_OAUTH_CLIENT_SECRET",
              "SESSION_SIGNING_KEY", "CF_D1_READ_API_TOKEN",
          }
          if "FIREBASE_OWNER_UID" in configured:
              secret_names.add("FIREBASE_OWNER_UID")
          updates = {}
          for name in sorted(secret_names):
              item = configured[name]
              if item.get("type") == "secret_text":
                  continue
              if item.get("type") != "plain_text" or not isinstance(item.get("value"), str) or not item["value"]:
                  raise SystemExit("Cannot safely convert Pages secret variable: " + name)
              updates[name] = {"type": "secret_text", "value": item["value"]}

          if updates:
              # PATCH only the selected keys. Do not replace the complete env_vars map.
              api("PATCH", {"deployment_configs": {"production": {"env_vars": updates}}})
              project_data = api("GET")
              configured = project_data.get("deployment_configs", {}).get("production", {}).get("env_vars") or {}

          still_plain = sorted(name for name in secret_names if configured.get(name, {}).get("type") != "secret_text")
          missing = sorted(required - set(configured))
          if missing:
              raise SystemExit("Production Pages variables disappeared during secret hardening: " + ", ".join(missing))
          if still_plain:
              raise SystemExit("Production Pages variables could not be secured as secret text: " + ", ".join(still_plain))
          print("Required production Pages variables are present; sensitive values are stored as secret text. Values were not printed.")
          PY
      - name: Set up Python for additive D1 migration
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply additive private activity D1 migration
        working-directory: python-engine/database
        env:
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python d1_client.py migrate
      - name: Verify D1 migration is complete before deployment
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          account = os.environ["CF_ACCOUNT_ID"]
          database = os.environ["CF_D1_DATABASE_ID"]
          token = os.environ["CF_D1_API_TOKEN"]
          sql = "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('monitoring_logs','import_batches','release_predictions')"
          request = Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query",
              data=json.dumps({"sql": sql, "params": []}).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare D1 schema preflight failed.")
          results = payload.get("result", [])
          rows = results[0].get("results", []) if results and isinstance(results[0], dict) else []
          found = {row.get("name") for row in rows if isinstance(row, dict)}
          required = {"monitoring_logs", "import_batches", "release_predictions"}
          missing = sorted(required - found)
          if missing:
              raise SystemExit("D1 migration is incomplete; run Migrate Private Activity Monitor D1 before deploying.")
          print("Required private activity-monitor D1 tables are present.")
          PY
      - name: Deploy isolated private dashboard
        working-directory: owner-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_OWNER_PAGES_PROJECT_NAME }}
        run: npx --yes wrangler@4.156.2 pages deploy public --project-name "$PROJECT_NAME" --branch main
      - name: Verify deployed Owner authentication configuration
        env:
          PROJECT_NAME: ${{ secrets.CF_OWNER_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          url="https://${PROJECT_NAME}.pages.dev/auth/health"
          status="000"
          for attempt in $(seq 1 12); do
            status=$(curl --connect-timeout 5 --max-time 10 -sS -D /tmp/owner-health-headers \
              -o /tmp/owner-health.json -w "%{http_code}" "$url" 2>/tmp/owner-health-curl-error || true)
            if [ "$status" = "200" ] && python -c 'import json; assert json.load(open("/tmp/owner-health.json"))["ready"] is True'; then
              echo "Private Owner dashboard configuration is ready."
              exit 0
            fi
            echo "Owner health attempt $attempt returned HTTP $status."
            if [ "$status" = "503" ] && [ -s /tmp/owner-health.json ]; then
              python - <<'PY'
          import json
          try:
              result = json.load(open("/tmp/owner-health.json", encoding="utf-8"))
              print("Sanitized readiness reason:", result.get("reason", "unspecified"))
              print("D1 upstream HTTP status:", result.get("upstream_status", "not available"))
          except Exception:
              print("Health response was not valid diagnostic JSON.")
          PY
            fi
            sleep 5
          done
          echo "Final Owner health HTTP status: $status"
          echo "Response headers:"
          cat /tmp/owner-health-headers || true
          echo "Response body:"
          cat /tmp/owner-health.json || true
          echo "Transport error:"
          cat /tmp/owner-health-curl-error || true
          echo "::error::Private Owner dashboard configuration is incomplete; see production Pages variables."
          exit 1

      - name: Run live signed-out route and authentication smoke tests
        env:
          PROJECT_NAME: ${{ secrets.CF_OWNER_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          base="https://${PROJECT_NAME}.pages.dev"
          check_redirect() {
            path="$1"
            expected="$2"
            code=$(curl --connect-timeout 5 --max-time 10 -sS -D /tmp/owner-headers -o /dev/null -w "%{http_code}" "$base$path")
            test "$code" = "302" || { echo "::error::Expected signed-out redirect for $path; received HTTP $code."; exit 1; }
            grep -Fqi "location: $expected" /tmp/owner-headers || { echo "::error::Unexpected redirect target for $path."; cat /tmp/owner-headers; exit 1; }
          }
          check_public_asset() {
            path="$1"
            code=$(curl --connect-timeout 5 --max-time 15 -sS -L --max-redirs 3 -o /tmp/owner-asset-body -w "%{http_code}" "$base$path")
            final_url=$(curl --connect-timeout 5 --max-time 15 -sS -L --max-redirs 3 -o /dev/null -w "%{url_effective}" "$base$path")
            case "$final_url" in
              "$base"/*) ;;
              *) echo "::error::Public handoff asset $path redirected outside the private Pages origin."; exit 1 ;;
            esac
            test "$code" = "200" || { echo "::error::Public handoff asset $path ended with HTTP $code at $final_url."; exit 1; }
          }

          # Direct dashboard documents, private scripts/styles, and private APIs must not load signed out.
          check_redirect "/" "https://ph-exam-results.pages.dev/?owner=login"
          check_redirect "/activity.js" "https://ph-exam-results.pages.dev/?owner=login"
          check_redirect "/owner.css" "https://ph-exam-results.pages.dev/?owner=login"
          check_redirect "/api/activity" "https://ph-exam-results.pages.dev/?owner=login"

          # Only the short-lived Firebase handoff and narrowly scoped auth endpoints are public.
          check_public_asset "/continue.html"
          check_public_asset "/continue"
          check_public_asset "/continue.js"
          check_public_asset "/continue.css"
          curl --connect-timeout 5 --max-time 10 -fsS "$base/auth/session" -o /tmp/owner-session.json
          python -c 'import json; assert json.load(open("/tmp/owner-session.json")) == {"authenticated": False}'
          check_redirect "/auth/login" "https://ph-exam-results.pages.dev/?owner=login&owner_reason=firebase_required"

          # Cross-origin proof completion and Firebase CORS preflight must fail closed.
          status=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w "%{http_code}" -X POST "$base/auth/firebase/complete" \
            -H "Origin: https://attacker.example" -H "Content-Type: application/json" --data '{}')
          test "$status" = "403" || { echo "::error::Cross-origin Firebase proof completion was not rejected."; exit 1; }
          status=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w "%{http_code}" -X OPTIONS "$base/auth/firebase" \
            -H "Origin: https://attacker.example" -H "Access-Control-Request-Method: POST")
          test "$status" = "403" || { echo "::error::Untrusted Firebase CORS preflight was not rejected."; exit 1; }

          # The configured public origin must be allowed to start the Firebase sign-in request.
          status=$(curl --connect-timeout 5 --max-time 10 -sS -D /tmp/owner-trusted-cors-headers -o /dev/null -w "%{http_code}" -X OPTIONS "$base/auth/firebase" \
            -H "Origin: https://ph-exam-results.pages.dev" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")
          if test "$status" != "204"; then
            echo "::error::The public site origin is not allowed by Firebase CORS (expected HTTP 204; received $status)."
            cat /tmp/owner-trusted-cors-headers
            exit 1
          fi
          grep -Fqi "access-control-allow-origin: https://ph-exam-results.pages.dev" /tmp/owner-trusted-cors-headers || {
            echo "::error::Firebase CORS did not return the exact public site origin."; cat /tmp/owner-trusted-cors-headers; exit 1;
          }
          echo "Live signed-out route, private asset/API, Firebase handoff, trusted/untrusted CORS, and session checks passed."
