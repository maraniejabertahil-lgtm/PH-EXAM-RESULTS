name: Private PRC LET Staging Extraction

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Approved PRC LEPT source ID
        required: true
        type: choice
        options:
          - PRC-LEPT-2026-03-ELEMENTARY
          - PRC-LEPT-2026-03-SECONDARY

permissions:
  contents: read

jobs:
  extract-private:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging source registry and extractor
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PDF and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
          npm install --no-save --no-package-lock pdfjs-dist@4.10.38

      - name: Validate extractor syntax
        run: node --check tools/extract-prc-let-pdf.mjs

      - name: Acquire and extract approved official PRC LEPT PDF
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_REGISTRY: python-engine/config/prc-let-sources.json
          OUTPUT_DIR: private-prc-let-extraction
        run: node tools/extract-prc-let-pdf.mjs

      - name: Upload private staging report and source files
        uses: actions/upload-artifact@v4
        with:
          name: private-prc-let-staging-${{ github.run_id }}
          path: private-prc-let-extraction/
          if-no-files-found: error
          retention-days: 1
