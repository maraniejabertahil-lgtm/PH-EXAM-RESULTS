name: Public Preview Shards Tests

on:
  push:
    branches: [main, Winner-Candidate]
    paths:
      - 'python-engine/extractor/public_preview_shards.py'
      - 'python-engine/tests/test_public_preview_shards.py'
      - 'python-engine/acquisition/public_preview_shards_bridge.py'
      - 'python-engine/acquisition/public_preview.py'
      - 'python-engine/tests/test_public_preview_shards_bridge.py'
      - '.github/workflows/public-preview-shards-tests.yml'
  pull_request:
    branches: [main, Winner-Candidate]
    paths:
      - 'python-engine/extractor/public_preview_shards.py'
      - 'python-engine/tests/test_public_preview_shards.py'
      - 'python-engine/acquisition/public_preview_shards_bridge.py'
      - 'python-engine/acquisition/public_preview.py'
      - 'python-engine/tests/test_public_preview_shards_bridge.py'
      - '.github/workflows/public-preview-shards-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python Engine test dependencies
        run: python -m pip install -r python-engine/requirements.txt
      - name: Run public-preview capture and extraction-bridge regression tests
        run: |
          python -m unittest discover -s python-engine/tests -p 'test_public_preview_shards.py' -v
          python -m unittest discover -s python-engine/tests -p 'test_public_preview_shards_bridge.py' -v
