name: Process Detected Source and Manual Drop

on:
  repository_dispatch:
    types:
      - source-detected
      - prc-release-detected
  push:
    branches:
      - main
    paths:
      - "manual-drop/normalized-batch.json"
  workflow_dispatch:
    inputs:
      batch_file:
        description: "Repository-relative JSON for already-reviewed, publicly released result records."
        required: false
        type: string
        default: "manual-drop/normalized-batch.json"
      review_run_id:
        description: "Successful PRC capture workflow run ID containing the candidate to publish after review."
        required: false
        type: string
      owner_review_receipt:
        description: "Paste the complete approved JSON receipt downloaded from /review.html."
        required: false
        type: string
      lept_pair_run_id:
        description: "Successful March 2026 LEPT live-retrieval workflow run ID containing both official lists."
        required: false
        type: string
      elementary_owner_review_receipt:
        description: "Paste the approved Elementary receipt from /review.html."
        required: false
        type: string
      secondary_owner_review_receipt:
        description: "Paste the approved Secondary receipt from /review.html."
        required: false
        type: string

permissions:
  contents: read

jobs:
  receive-detected-source:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source registry
        uses: actions/checkout@v5
      - name: Validate the Watcher event against the owner-approved registry
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys
          sys.path.insert(0, "python-engine/retrieval")
          from watcher_event_validation import is_approved_drive_event

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          if not isinstance(payload, dict):
              raise SystemExit("Rejected: event payload must be an object.")

          required = ("source_id", "authority", "exam", "detected_url")
          if any(not isinstance(payload.get(key), str) or not payload[key].strip() for key in required):
              raise SystemExit("Rejected: required source-detection fields are missing.")
          if payload["authority"] not in {"PRC", "CSC"}:
              raise SystemExit("Rejected: unsupported examination authority.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,59}", payload["source_id"]):
              raise SystemExit("Rejected: invalid source ID.")

          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          if not isinstance(registry, dict) or not isinstance(registry.get("sources"), list):
              raise SystemExit("Rejected: approved source registry is invalid.")
          matches = [
              item for item in registry["sources"]
              if isinstance(item, dict) and item.get("id") == payload["source_id"]
          ]
          if len(matches) != 1:
              raise SystemExit("Rejected: source ID must match exactly one registry entry.")
          source = matches[0]

          if source.get("enabled") is not True:
              raise SystemExit("Rejected: source is not enabled.")
          authorized = (
              source.get("source_type") == "official" and source.get("authorized") is True
          ) or (
              source.get("source_type") == "verified_third_party"
              and source.get("verified_by_owner") is True
          )
          if not authorized:
              raise SystemExit("Rejected: source is not owner-authorized or owner-verified.")
          if source.get("authority") != payload["authority"] or source.get("exam") != payload["exam"]:
              raise SystemExit("Rejected: event metadata does not match the approved registry.")
          if payload.get("source_type") and payload["source_type"] != source.get("source_type"):
              raise SystemExit("Rejected: source type does not match the approved registry.")
          if source.get("file_format") != "pdf":
              raise SystemExit("Rejected: source is not configured for PDF files.")

          detected = urlsplit(payload["detected_url"])
          if (
              detected.scheme != "https" or not detected.hostname
              or detected.username or detected.password
          ):
              raise SystemExit("Rejected: detected URL must be HTTPS and contain no credentials.")

          if detected.hostname.lower() == "drive.google.com":
              if not is_approved_drive_event(payload, source, detected):
                  raise SystemExit("Rejected: Google Drive URL is neither an exact owner-approved ID nor a verified official-page discovery event.")
          else:
              approved = urlsplit(source.get("url", ""))
              def origin(parts):
                  try:
                      return (
                          parts.scheme,
                          (parts.hostname or "").lower(),
                          parts.port or 443,
                      )
                  except ValueError:
                      return None
              if origin(detected) is None or origin(detected) != origin(approved) or approved.scheme != "https":
                  raise SystemExit("Rejected: detected PDF is outside the approved HTTPS source origin.")
              if not (
                  detected.path.lower().endswith(".pdf")
                  or str(payload.get("content_type", "")).lower() == "application/pdf"
              ):
                  raise SystemExit("Rejected: detected resource is not identified as a PDF.")

          report = {
              "status": "validated_phase_1_event_manual_review_required",
              "source_id": source["id"],
              "authority": source["authority"],
              "exam": source["exam"],
              "detected_url": payload["detected_url"],
              "source_page_url": payload.get("source_page_url"),
              "source_article_url": payload.get("source_article_url"),
              "detection_method": payload.get("detection_method", "not supplied"),
              "validation_only": True,
              "pdf_acquired": False,
              "extraction_performed": False,
              "published": False,
          }
          Path("watcher-event-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Phase 1 Watcher event validated\n\n"
                  f"- Source: `{source['id']}`\n"
                  f"- Authority / examination: `{source['authority']} / {source['exam']}`\n"
                  f"- Detection method: `{report['detection_method']}`\n"
                  "- Validation only: no PDF acquisition, extraction, or publication.\n"
              )
          print("Owner-approved Watcher event validated successfully.")
          print("No PDF was acquired, extracted, or published.")
          PY

      - name: Preserve validation report
        if: always() && hashFiles('watcher-event-validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: watcher-event-validation-${{ github.run_id }}
          path: watcher-event-validation.json
          if-no-files-found: error
          retention-days: 7

  process-reviewed-batch:
    if: (github.event_name == 'workflow_dispatch' && inputs.review_run_id == '' && inputs.lept_pair_run_id == '') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out reviewed batch and Python engine
        uses: actions/checkout@v5

      - name: Require owner-dispatched manual publication from main
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Manual publication may only run from main."; exit 1; }
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER" || { echo "::error::Only the repository owner may dispatch manual publication."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python engine dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt

      - name: Install Tesseract only for explicitly selected Tier 3 OCR
        env:
          BATCH_FILE: ${{ github.event_name == 'push' && 'manual-drop/normalized-batch.json' || inputs.batch_file }}
        run: |
          set -euo pipefail
          if python -c 'import json,os; p=os.environ["BATCH_FILE"]; b=json.load(open(p,encoding="utf-8")); raise SystemExit(0 if b.get("official_content_mode")=="static_png_ocr" else 1)' ; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          else
            echo "Tier 3 OCR not selected; skipping Tesseract installation."
          fi
      - name: Run Greenlight-to-GitOps processing pipeline
        env:
          BATCH_FILE: ${{ github.event_name == 'push' && 'manual-drop/normalized-batch.json' || inputs.batch_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python python-engine/main.py "$BATCH_FILE"


  process-prc-release-event:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'prc-release-detected'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Greenlight pipeline dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Detect whether this event needs the approved preview browser
        id: preview-browser
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          event = payload.get("event") if isinstance(payload, dict) else None
          if not isinstance(event, dict):
              raise SystemExit("Rejected: nested PRC release event must be an object.")
          identity = event.get("exam_code", "")
          if event.get("result_level"):
              identity += "-" + str(event["result_level"]).upper()
          exam = f"{identity}-{event.get('exam_year', '')}"
          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          sources = registry.get("sources", [])
          source = next((
              item for item in sources
              if isinstance(item, dict)
              and item.get("authority") == "PRC"
              and item.get("exam") == exam
          ), {})
          content_urls = event.get("content_urls", [])
          content_url = content_urls[0].get("url", "") if len(content_urls) == 1 and isinstance(content_urls[0], dict) else ""
          parsed = urlsplit(content_url)
          path_parts = parsed.path.split("/")
          drive_file_id = path_parts[3] if (
              parsed.scheme == "https"
              and parsed.hostname == "drive.google.com"
              and len(path_parts) == 5
              and path_parts[1:3] == ["file", "d"]
              and path_parts[4] == "view"
          ) else ""
          settings = source.get("public_preview", {})
          required = (
              source.get("enabled") is True
              and source.get("auto_acquire") is True
              and isinstance(settings, dict)
              and settings.get("enabled") is True
              and drive_file_id in source.get("drive_file_ids", [])
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          PY
      - name: Install approved public-preview browser
        if: steps.preview-browser.outputs.required == 'true'
        working-directory: python-engine
        run: |
          python -m pip install -r requirements-preview.txt
          python -m playwright install --with-deps chromium
      - name: Acquire and normalize the official PRC result
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          event = payload.get("event") if isinstance(payload, dict) else None
          if not isinstance(event, dict):
              raise SystemExit("Rejected: nested PRC release event must be an object.")
          Path("event.json").write_text(
              json.dumps(event, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 python-engine/prc_orchestrator.py --event event.json --out prc-release-output
      - name: Check whether this candidate requires owner visual review
        id: candidate
        env:
          PYTHONPATH: python-engine
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from publication_policy import requires_owner_visual_review

          batch = json.loads(Path("prc-release-output/release-batch.json").read_text(encoding="utf-8"))
          required = requires_owner_visual_review(batch, root=Path.cwd())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"owner_review_required={'true' if required else 'false'}\n")
          PY
      - name: Create local owner-review bundle
        if: steps.candidate.outputs.owner_review_required == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=python-engine python python-engine/create_review_bundle.py \
            --batch prc-release-output/release-batch.json \
            --out prc-release-output/review-bundle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("prc-release-output/report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          bundle = json.loads(Path("prc-release-output/review-bundle.json").read_text(encoding="utf-8"))
          report["status"] = "owner_review_required"
          report["published"] = False
          report["review_bundle"] = {
              "path": "review-bundle.json",
              "candidate_sha256": bundle["candidate_sha256"],
              "capture_manifest_sha256": bundle["capture_manifest_sha256"],
          }
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Candidate is ready for owner review\n\n"
                  f"- Records: `{bundle['record_count']}`\n"
                  f"- Review bundle: `{len(bundle['evidence'])}` hash-verified screenshot pages\n"
                  f"- Candidate SHA-256: `{bundle['candidate_sha256']}`\n"
                  "- No publication, dataset PR, merge, or deployment was performed.\n"
              )
          PY
      - name: Run Greenlight and publish verified official records
        if: success() && steps.candidate.outputs.owner_review_required != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python python-engine/main.py prc-release-output/release-batch.json
      - name: Record successful publication
        if: success() && steps.candidate.outputs.owner_review_required != 'true'
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("prc-release-output/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["status"] = "published"
          report["published"] = True
          report["published_at"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve event and processing report
        if: always() && hashFiles('prc-release-output/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prc-release-processing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prc-release-output/
            event.json
          retention-days: 7

  publish-owner-reviewed-lept-pair:
    if: github.event_name == 'workflow_dispatch' && inputs.lept_pair_run_id != '' && inputs.review_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Require owner-dispatched atomic LEPT publication from main
        env:
          LEPT_PAIR_RUN_ID: ${{ inputs.lept_pair_run_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::LEPT publication may only run from main."; exit 1; }
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER" || { echo "::error::Only the repository owner may publish reviewed LEPT results."; exit 1; }
          [[ "$LEPT_PAIR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::lept_pair_run_id must be numeric."; exit 1; }

      - name: Check out the main-branch publication pipeline
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python engine dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt

      - name: Verify the exact source retrieval run completed successfully
        env:
          LEPT_PAIR_RUN_ID: ${{ inputs.lept_pair_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          run_id = os.environ["LEPT_PAIR_RUN_ID"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "PH-EXAM-RESULTS-LEPT-Publisher",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              run = json.loads(response.read().decode("utf-8"))
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("path") != ".github/workflows/prc-lept-march-2026-live-retrieval.yml"
              or run.get("head_repository", {}).get("full_name") != repository
              or run.get("head_branch") != "feat/prc-humanized-multi-list-routing"
              or not isinstance(run.get("head_sha"), str)
          ):
              raise SystemExit("Selected run is not the successful, exact March 2026 LEPT live-retrieval run.")

          # Require the retrieval run's exact source commit to be included in the
          # merged PR #185, and prove that later PR changes did not alter the
          # acquisition workflow, parser, mappings, or event construction.
          pr_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/pulls/185",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "PH-EXAM-RESULTS-LEPT-Publisher",
              },
          )
          with urllib.request.urlopen(pr_request, timeout=20) as response:
              pr = json.loads(response.read().decode("utf-8"))
          if (
              pr.get("state") != "closed"
              or pr.get("merged") is not True
              or pr.get("base", {}).get("ref") != "main"
              or pr.get("head", {}).get("ref") != "feat/prc-humanized-multi-list-routing"
          ):
              raise SystemExit("PR #185 must be merged into main before the paired publisher can run.")
          comparison_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/compare/{run['head_sha']}...{pr['head']['sha']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "PH-EXAM-RESULTS-LEPT-Publisher",
              },
          )
          with urllib.request.urlopen(comparison_request, timeout=20) as response:
              comparison = json.loads(response.read().decode("utf-8"))
          allowed_later_paths = {
              ".github/workflows/process-import.yml",
              "python-engine/publish_lept_pair.py",
              "python-engine/tests/test_publish_lept_pair.py",
              ".github/workflows/lept-pair-publisher-tests.yml",
              ".github/workflows/public-preview-shards-tests.yml",
              "public/review.html",
              "public/assets/js/review.mjs",
              ".github/workflows/public-review-tests.yml",
              "LIVE_ACCEPTANCE_TEST_REGISTER.md",
          }
          changed_paths = {item.get("filename") for item in comparison.get("files", [])}
          if comparison.get("status") not in {"ahead", "identical"} or not changed_paths.issubset(allowed_later_paths):
              raise SystemExit("The live retrieval commit is not a verified ancestor of the merged publication code.")
          print("Exact two-level live-retrieval run verified:", run_id, run["head_sha"])
          PY

      - name: Download both exact LEPT result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prc-lept-*-passer-retrieval-${{ inputs.lept_pair_run_id }}
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.lept_pair_run_id }}
          path: prc-lept-artifacts

      - name: Restore the two candidate workspaces
        env:
          LEPT_PAIR_RUN_ID: ${{ inputs.lept_pair_run_id }}
        run: |
          set -euo pipefail
          ELEMENTARY="prc-lept-artifacts/prc-lept-elementary-passer-retrieval-$LEPT_PAIR_RUN_ID/prc-lept-elementary-output"
          SECONDARY="prc-lept-artifacts/prc-lept-secondary-passer-retrieval-$LEPT_PAIR_RUN_ID/prc-lept-secondary-output"
          test -f "$ELEMENTARY/release-batch.json" || { echo "::error::Elementary candidate artifact is missing."; exit 1; }
          test -f "$SECONDARY/release-batch.json" || { echo "::error::Secondary candidate artifact is missing."; exit 1; }
          mkdir -p prc-lept-elementary-output prc-lept-secondary-output
          cp -a "$ELEMENTARY/." prc-lept-elementary-output/
          cp -a "$SECONDARY/." prc-lept-secondary-output/

      - name: Save both exact Owner review receipts
        env:
          ELEMENTARY_RECEIPT_JSON: ${{ inputs.elementary_owner_review_receipt }}
          SECONDARY_RECEIPT_JSON: ${{ inputs.secondary_owner_review_receipt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          for key, path in (
              ("ELEMENTARY_RECEIPT_JSON", "prc-lept-artifacts/elementary-owner-review-receipt.json"),
              ("SECONDARY_RECEIPT_JSON", "prc-lept-artifacts/secondary-owner-review-receipt.json"),
          ):
              raw = os.environ.get(key, "")
              if not raw.strip():
                  raise SystemExit(f"Missing required Owner review receipt: {key}")
              try:
                  receipt = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{key} is not valid JSON: {exc}")
              if not isinstance(receipt, dict):
                  raise SystemExit(f"{key} must be a JSON object.")
              Path(path).write_text(
                  json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Publish both Owner-approved LEPT lists in one atomic dataset PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python python-engine/publish_lept_pair.py \
            --run-id "${{ inputs.lept_pair_run_id }}" \
            --elementary-batch prc-lept-elementary-output/release-batch.json \
            --secondary-batch prc-lept-secondary-output/release-batch.json \
            --elementary-receipt prc-lept-artifacts/elementary-owner-review-receipt.json \
            --secondary-receipt prc-lept-artifacts/secondary-owner-review-receipt.json

      - name: Preserve atomic LEPT publication report
        if: always() && hashFiles('python-engine/artifacts/lept-pair-publication-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prc-lept-pair-publication-${{ github.run_id }}
          path: python-engine/artifacts/lept-pair-publication-report.json
          retention-days: 30

  publish-owner-reviewed-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.review_run_id != '' && inputs.lept_pair_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Require an owner-dispatched run from main
        env:
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Reviewed previews may only be published from main."; exit 1; }
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER" || { echo "::error::Only the repository owner may dispatch reviewed-preview publication."; exit 1; }
          [[ "$REVIEW_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::review_run_id must be a numeric Actions run ID."; exit 1; }

      - name: Check out the main-branch pipeline
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download the exact candidate capture artifact
        uses: actions/download-artifact@v4
        with:
          pattern: prc-release-processing-${{ inputs.review_run_id }}-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.review_run_id }}
          path: .

      - name: Require an approved receipt and publish the reviewed candidate
        env:
          REVIEW_RECEIPT_JSON: ${{ inputs.owner_review_receipt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f prc-release-output/release-batch.json || { echo "::error::The selected run has no PRC capture batch."; exit 1; }
          test -n "$REVIEW_RECEIPT_JSON" || { echo "::error::Paste the approved review receipt from /review.html."; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path("prc-release-output/release-batch.json").read_text(encoding="utf-8"))
          if batch.get("exam") in {"LEPT-ELEMENTARY", "LEPT-SECONDARY"}:
              raise SystemExit("March 2026 LEPT must use the atomic pair publication job with both Owner receipts.")
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              receipt = json.loads(os.environ["REVIEW_RECEIPT_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Review receipt is not valid JSON: {exc}")
          if not isinstance(receipt, dict):
              raise SystemExit("Review receipt must be a JSON object.")
          Path("prc-release-output/owner-review-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python python-engine/main.py prc-release-output/release-batch.json \
            --owner-review-receipt prc-release-output/owner-review-receipt.json
