name: Process Detected Source and Manual Drop

on:
  repository_dispatch:
    types:
      - source-detected
  push:
    paths:
      - "manual-drop/**"

permissions:
  contents: read

jobs:
  process-detected-source:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source registry
        uses: actions/checkout@v5
      - name: Validate the Watcher event against the approved registry
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          required = ("source_id", "authority", "exam", "detected_url")
          if any(not isinstance(payload.get(key), str) or not payload[key].strip() for key in required):
              raise SystemExit("Rejected: required source-detection fields are missing.")
          if payload["authority"] not in {"PRC", "CSC"}:
              raise SystemExit("Rejected: unsupported examination authority.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,59}", payload["source_id"]):
              raise SystemExit("Rejected: invalid source ID.")

          detected = urlsplit(payload["detected_url"])
          if detected.scheme != "https" or not detected.hostname or detected.username or detected.password:
              raise SystemExit("Rejected: detected URL must be HTTPS and contain no credentials.")
          if not (detected.path.lower().endswith(".pdf") or payload.get("content_type", "").lower() == "application/pdf"):
              raise SystemExit("Rejected: detected URL is not identified as a PDF.")

          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          sources = {item.get("id"): item for item in registry.get("sources", [])}
          source = sources.get(payload["source_id"])
          if not source or source.get("enabled") is not True:
              raise SystemExit("Rejected: source is not present and enabled in the approved registry.")
          authorized = (
              source.get("source_type") == "official" and source.get("authorized") is True
          ) or (
              source.get("source_type") == "verified_third_party" and source.get("verified_by_owner") is True
          )
          if not authorized:
              raise SystemExit("Rejected: source is not owner-authorized or owner-verified.")
          approved = urlsplit(source.get("url", ""))
          if detected.scheme != approved.scheme or detected.netloc.lower() != approved.netloc.lower():
              raise SystemExit("Rejected: detected PDF is outside the approved source origin.")
          if payload["authority"] != source.get("authority") or payload["exam"] != source.get("exam"):
              raise SystemExit("Rejected: source metadata does not match the approved registry.")

          summary = (
              "## Watcher event received\n\n"
              f"- Source: `{payload['source_id']}`\n"
              f"- Authority / examination: `{payload['authority']} / {payload['exam']}`\n"
              f"- PDF URL: `{payload['detected_url']}`\n"
              f"- Detection method: `{payload.get('detection_method', 'not supplied')}`\n\n"
              "This is the Phase 1 receiver. Python acquisition/extraction and Greenlight processing are connected in Phase 2. "
              "No result data was processed or published by this workflow.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print("Approved Watcher event received. Phase 2 processing is not yet enabled.")
          PY

  receive-manual-drop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the manual-drop folder
        uses: actions/checkout@v5
      - name: Confirm manual-drop event
        run: |
          echo "A change was received in manual-drop/."
          echo "Manual-drop processing remains a separate owner-triggered workflow."
          echo "No result data was published by this workflow."
