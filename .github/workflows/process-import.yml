name: Process Detected Source and Manual Drop

on:
  repository_dispatch:
    types:
      - source-detected
  push:
    paths:
      - "manual-drop/**"

permissions:
  contents: read

jobs:
  receive-detected-source:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source registry
        uses: actions/checkout@v5
      - name: Validate the Watcher event against the owner-approved registry
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          if not isinstance(payload, dict):
              raise SystemExit("Rejected: event payload must be an object.")

          required = ("source_id", "authority", "exam", "detected_url")
          if any(not isinstance(payload.get(key), str) or not payload[key].strip() for key in required):
              raise SystemExit("Rejected: required source-detection fields are missing.")
          if payload["authority"] not in {"PRC", "CSC"}:
              raise SystemExit("Rejected: unsupported examination authority.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,59}", payload["source_id"]):
              raise SystemExit("Rejected: invalid source ID.")

          registry = json.loads(Path("python-engine/config/sources.json").read_text(encoding="utf-8"))
          if not isinstance(registry, dict) or not isinstance(registry.get("sources"), list):
              raise SystemExit("Rejected: approved source registry is invalid.")
          matches = [
              item for item in registry["sources"]
              if isinstance(item, dict) and item.get("id") == payload["source_id"]
          ]
          if len(matches) != 1:
              raise SystemExit("Rejected: source ID must match exactly one registry entry.")
          source = matches[0]

          if source.get("enabled") is not True:
              raise SystemExit("Rejected: source is not enabled.")
          authorized = (
              source.get("source_type") == "official" and source.get("authorized") is True
          ) or (
              source.get("source_type") == "verified_third_party"
              and source.get("verified_by_owner") is True
          )
          if not authorized:
              raise SystemExit("Rejected: source is not owner-authorized or owner-verified.")
          if source.get("authority") != payload["authority"] or source.get("exam") != payload["exam"]:
              raise SystemExit("Rejected: event metadata does not match the approved registry.")
          if payload.get("source_type") and payload["source_type"] != source.get("source_type"):
              raise SystemExit("Rejected: source type does not match the approved registry.")
          if source.get("file_format") != "pdf":
              raise SystemExit("Rejected: source is not configured for PDF files.")

          detected = urlsplit(payload["detected_url"])
          if (
              detected.scheme != "https" or not detected.hostname
              or detected.username or detected.password
          ):
              raise SystemExit("Rejected: detected URL must be HTTPS and contain no credentials.")

          if detected.hostname.lower() == "drive.google.com":
              query = parse_qs(detected.query, keep_blank_values=True)
              allowed_ids = source.get("drive_file_ids", [])
              file_ids = query.get("id", [])
              exact_approved_id = (
                  isinstance(allowed_ids, list) and file_ids[0] in allowed_ids
                  if len(file_ids) == 1 else False
              )
              linked_from_approved_page = (
                  source.get("allow_linked_drive_documents") is True
                  and payload.get("detection_method") == "official_page_drive_link"
                  and payload.get("source_page_url") == source.get("url")
                  and isinstance(payload.get("source_page_url"), str)
                  and urlsplit(payload["source_page_url"]).scheme == "https"
                  and urlsplit(payload["source_page_url"]).hostname
                  and urlsplit(payload["source_page_url"]).username is None
                  and urlsplit(payload["source_page_url"]).password is None
                  and re.fullmatch(r"[A-Za-z0-9_-]{10,200}", file_ids[0])
                  if len(file_ids) == 1 else False
              )
              if (
                  detected.path != "/uc"
                  or query.get("export") != ["download"]
                  or len(file_ids) != 1
                  or detected.port not in (None, 443)
                  or not (exact_approved_id or linked_from_approved_page)
              ):
                  raise SystemExit("Rejected: Google Drive URL is neither an exact owner-approved ID nor a verified official-page discovery event.")
          else:
              approved = urlsplit(source.get("url", ""))
              def origin(parts):
                  try:
                      return (
                          parts.scheme,
                          (parts.hostname or "").lower(),
                          parts.port or 443,
                      )
                  except ValueError:
                      return None
              if origin(detected) is None or origin(detected) != origin(approved) or approved.scheme != "https":
                  raise SystemExit("Rejected: detected PDF is outside the approved HTTPS source origin.")
              if not (
                  detected.path.lower().endswith(".pdf")
                  or str(payload.get("content_type", "")).lower() == "application/pdf"
              ):
                  raise SystemExit("Rejected: detected resource is not identified as a PDF.")

          report = {
              "status": "validated_phase_1_event_manual_review_required",
              "source_id": source["id"],
              "authority": source["authority"],
              "exam": source["exam"],
              "detected_url": payload["detected_url"],
              "source_page_url": payload.get("source_page_url"),
              "detection_method": payload.get("detection_method", "not supplied"),
              "validation_only": True,
              "pdf_acquired": False,
              "extraction_performed": False,
              "published": False,
          }
          Path("watcher-event-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Phase 1 Watcher event validated\n\n"
                  f"- Source: `{source['id']}`\n"
                  f"- Authority / examination: `{source['authority']} / {source['exam']}`\n"
                  f"- Detection method: `{report['detection_method']}`\n"
                  "- Validation only: no PDF acquisition, extraction, or publication.\n"
              )
          print("Owner-approved Watcher event validated successfully.")
          print("No PDF was acquired, extracted, or published.")
          PY

      - name: Preserve validation report
        if: always() && hashFiles('watcher-event-validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: watcher-event-validation-${{ github.run_id }}
          path: watcher-event-validation.json
          if-no-files-found: error
          retention-days: 7

  receive-manual-drop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the manual-drop folder
        uses: actions/checkout@v5
      - name: Confirm manual-drop event
        run: |
          echo "A change was received in manual-drop/."
          echo "Manual-drop processing remains a separate owner-triggered workflow."
          echo "No result data was processed or published by this workflow."
