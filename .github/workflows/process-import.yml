name: Process Detected Source and Manual Drop

on:
  repository_dispatch:
    types:
      - source-detected
      - staging-source-detected
  push:
    paths:
      - "manual-drop/**"

permissions:
  contents: read

jobs:
  process-detected-source:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source registry and Python engine
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt

      - name: Install PDF extraction dependencies
        run: python -m pip install -r python-engine/requirements.txt

      - name: Save the Watcher event payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          Path("/tmp/source-detected-event.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Validate, acquire, and extract the approved PDF
        env:
          PYTHONPATH: python-engine
        run: |
          set -euo pipefail
          python python-engine/scraper/event_processor.py \
            --payload /tmp/source-detected-event.json \
            --registry python-engine/config/sources.json \
            --output artifacts/detected-source/review.json

      - name: Upload private PDF text-review artifact
        if: always() && hashFiles('artifacts/detected-source/review.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: detected-source-review-${{ github.run_id }}
          path: artifacts/detected-source/review.*
          if-no-files-found: error
          retention-days: 7

  receive-staging-source:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'staging-source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the staging branch and its approved source registry
        uses: actions/checkout@v5
        with:
          ref: implementation/two-public-pages
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r python-engine/requirements.txt

      - name: Save the staging Watcher event payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          Path("/tmp/staging-source-detected-event.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Validate against the staging registry without acquiring the PDF
        env:
          PYTHONPATH: python-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scraper.event_processor import process_detected_pdf

          registry_path = Path("python-engine/config/sources.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not isinstance(registry, dict) or not isinstance(registry.get("sources"), list):
              raise SystemExit("Staging registry must contain a sources array.")

          payload = json.loads(Path("/tmp/staging-source-detected-event.json").read_text(encoding="utf-8"))
          matches = [
              item for item in registry["sources"]
              if isinstance(item, dict) and item.get("id") == payload.get("source_id")
          ]
          if len(matches) != 1:
              raise SystemExit("Staging event source ID must match exactly one staging registry entry.")

          # Force validation-only behavior in a temporary copy. The checked-out
          # approved registry is never modified, and no PDF is downloaded.
          validation_registry = {
              **registry,
              "sources": [
                  {**item, "auto_acquire": False}
                  if isinstance(item, dict) and item.get("id") == payload.get("source_id")
                  else item
                  for item in registry["sources"]
              ],
          }
          temporary_registry = Path("/tmp/staging-validation-sources.json")
          temporary_registry.write_text(
              json.dumps(validation_registry, ensure_ascii=False),
              encoding="utf-8",
          )

          output = Path("artifacts/staging-detected-source/validation.json")
          report = process_detected_pdf(
              payload,
              temporary_registry,
              output,
          )
          if report.get("status") != "awaiting_owner_acquisition_approval":
              raise SystemExit("Staging validation did not finish in validation-only mode.")
          if report.get("manual_review_required") is not True:
              raise SystemExit("Staging validation report did not require owner review.")

          print("Staging event validated against the staging registry.")
          print("Validation-only: no PDF acquisition, extraction, or publication.")
          PY

      - name: Upload staging validation report
        if: always() && hashFiles('artifacts/staging-detected-source/validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-source-validation-${{ github.run_id }}
          path: artifacts/staging-detected-source/validation.json
          if-no-files-found: error
          retention-days: 7

  receive-manual-drop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the manual-drop folder
        uses: actions/checkout@v5
      - name: Confirm manual-drop event
        run: |
          echo "A change was received in manual-drop/."
          echo "Manual-drop processing remains a separate owner-triggered workflow."
          echo "No result data was published by this workflow."
