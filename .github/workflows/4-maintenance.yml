name: 4 - Weekly Maintenance

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r python-engine/requirements.txt
      - name: Run Python tests
        working-directory: python-engine
        run: python -m unittest discover -s tests -v
      - name: Validate public datasets
        run: python python-engine/maintenance.py

      - name: Check D1 storage usage when configured
        working-directory: python-engine
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" || -z "$D1_DATABASE_ID" ]]; then
            echo "D1 is not configured; storage check skipped."
          else
            python main.py d1-size
          fi
