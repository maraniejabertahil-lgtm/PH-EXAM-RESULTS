name: 0 - Pull Request Quality Checks
# Full regression run includes the Phase 1 Worker sync and Phase 2 event bridge.

on:
  push:
    branches:
      - implementation/two-public-pages
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-and-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r python-engine/requirements.txt
      - name: Validate GitHub Actions workflow YAML and token references
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |file| YAML.load_file(file); puts "Valid YAML: #{file}" }'
          ruby -e 'require "yaml"; files = %w[1-monitor-sources.yml 2-process-import.yml 5-set-preparing-mode.yml]; groups = files.map { |name| YAML.load_file(".github/workflows/#{name}")["concurrency"]["group"] }; abort("Owner-review PR workflows must share one concurrency group.") unless groups.uniq == ["owner-review-pr-creation"]'
          if grep -R -n --exclude='0-pull-request-ci.yml' 'secrets.GITHUB_TOKEN' .github/workflows; then
            echo "Use the built-in github.token context instead of a nonexistent default GITHUB_TOKEN secret."
            exit 1
          fi
      - name: Compile Python source
        run: python -m compileall -q python-engine
      - name: Run Python unit tests
        working-directory: python-engine
        run: python -m unittest discover -s tests -v
      - name: Live smoke test of the two owner-approved CSC Drive PDFs
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'LIVE-APPROVED-CSC-DRIVE-SMOKE')
        env:
          PYTHONPATH: python-engine
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-csc-review
          python - <<'PY'
          from pathlib import Path
          from scraper.event_processor import process_detected_pdf

          registry = "python-engine/config/sources.json"
          source_id = "CSC-CSE-PPT-2026-08-09-REGION-V"
          files = {
              "professional": "1jQmBLSU2azhFvCgU6l8m6ljXGDmIRa1l",
              "subprofessional": "1qYaCbxIZ_6DHyMD9FhgZdj-YtbIJh5Wf",
          }
          for label, file_id in files.items():
              payload = {
                  "source_id": source_id,
                  "authority": "CSC",
                  "exam": "CSE-PPT-2026",
                  "detected_url": (
                      "https://drive.google.com/uc?export=download&id=" + file_id
                  ),
                  "content_type": "application/pdf",
              }
              output = Path("artifacts/live-csc-review") / (label + "-review.json")
              report = process_detected_pdf(payload, registry, output)
              allowed_statuses = {
                  "text_extracted_manual_review_required",
                  "pdf_acquired_no_text_manual_visual_review_required",
              }
              if report.get("status") not in allowed_statuses:
                  raise SystemExit(f"{label}: unexpected processing status")
              pdf_path = output.with_suffix(".pdf")
              if not pdf_path.is_file() or pdf_path.stat().st_size < 5:
                  raise SystemExit(f"{label}: original PDF was not retained for manual review")
              print(
                  f"{label}: verified PDF download; "
                  f"{report['source_file_size_bytes']} bytes; "
                  f"{report['extracted_line_count']} selectable text lines; "
                  f"visual review required={report.get('visual_pdf_review_required', False)}; "
                  f"SHA-256 {report['source_file_sha256']}"
              )
          PY
      - name: Upload private CSC smoke-test text for manual review
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'LIVE-APPROVED-CSC-DRIVE-SMOKE') && always() && hashFiles('artifacts/live-csc-review/*-review.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: owner-approved-csc-drive-smoke-review
          path: artifacts/live-csc-review/*-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate public manifest, datasets, and site status
        run: python python-engine/maintenance.py
      - name: Check browser JavaScript module syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find public/assets/js -type f -name '*.js' -print)
      - name: Test public dataset structure validation
        run: node tests/loader-validation.test.mjs
      - name: Test Web Worker search with 50,000 records
        run: node tests/search-worker.test.mjs
      - name: Check Cloudflare Watcher JavaScript syntax
        run: node --check watcher-bot/src/index.js
      - name: Test Cloudflare Watcher
        run: node --test watcher-bot/tests/*.test.mjs
