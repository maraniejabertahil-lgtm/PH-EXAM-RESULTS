name: Watcher Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - ".github/workflows/nvidia-autonomous-repair.yml"
      - "scripts/nvidia_autonomous_repair.py"
      - "scripts/nvidia_publish_repair.py"
      - "python-engine/config/sources.json"
      - "python-engine/retrieval/**"
      - "python-engine/extractor/**"
      - "python-engine/acquisition/**"
      - "python-engine/processor/**"
      - "python-engine/publisher/**"
      - "python-engine/requirements.txt"
      - "python-engine/tests/**"
      - "public/data/**"
      - "tools/validate_public_datasets.py"
  pull_request:
    branches:
      - main
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - ".github/workflows/nvidia-autonomous-repair.yml"
      - "scripts/nvidia_autonomous_repair.py"
      - "python-engine/config/sources.json"
      - "python-engine/retrieval/**"
      - "python-engine/extractor/**"
      - "python-engine/acquisition/**"
      - "python-engine/processor/**"
      - "python-engine/publisher/**"
      - "python-engine/requirements.txt"
      - "python-engine/tests/**"
      - "public/data/**"
      - "tools/validate_public_datasets.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check watcher-bot/src/index.js
      - name: Run Watcher automated tests
        working-directory: watcher-bot
        run: npm test
      - name: Set up Python for public PDF retrieval tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python engine dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Validate NVIDIA repair coordinator syntax and workflow YAML
        run: |
          python -m py_compile scripts/nvidia_autonomous_repair.py scripts/nvidia_publish_repair.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/nvidia-autonomous-repair.yml", aliases: true); puts "NVIDIA repair workflow YAML: OK"'
      - name: Run Python engine unit tests
        working-directory: python-engine
        run: PYTHONPATH=retrieval python -m unittest discover -s tests -v
      - name: Validate committed public datasets and hashes
        run: python tools/validate_public_datasets.py
