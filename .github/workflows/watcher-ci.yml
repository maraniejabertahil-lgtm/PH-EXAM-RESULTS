name: Watcher Quality Checks

on:
  push:
    branches:
      - main
      - Winner-Candidate
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - ".github/workflows/nvidia-autonomous-repair.yml"
      - "scripts/nvidia_autonomous_repair.py"
      - "scripts/repair_patch_utils.py"
      - "scripts/test_nvidia_patch_format.py"
      - "scripts/nvidia_publish_repair.py"
      - "python-engine/**"
      - "public/data/**"
      - "tools/validate_public_datasets.py"
  pull_request:
    branches:
      - main
      - Winner-Candidate
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - ".github/workflows/nvidia-autonomous-repair.yml"
      - "scripts/nvidia_autonomous_repair.py"
      - "scripts/repair_patch_utils.py"
      - "scripts/test_nvidia_patch_format.py"
      - "scripts/nvidia_publish_repair.py"
      - "python-engine/**"
      - "public/data/**"
      - "tools/validate_public_datasets.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check watcher-bot/src/index.js
      - name: Run Watcher automated tests
        working-directory: watcher-bot
        run: npm test
      - name: Set up Python for public PDF retrieval tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python engine dependencies
        working-directory: python-engine
        run: python -m pip install -r requirements.txt
      - name: Validate NVIDIA repair coordinator syntax and workflow YAML
        run: |
          python -m py_compile scripts/nvidia_autonomous_repair.py scripts/nvidia_publish_repair.py scripts/repair_patch_utils.py
          python scripts/test_nvidia_patch_format.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/nvidia-autonomous-repair.yml", aliases: true); puts "NVIDIA repair workflow YAML: OK"'
      - name: Run in-scope Python tests (exclude CSC-specific suites per D-003)
        working-directory: python-engine
        run: |
          PYTHONPATH=retrieval python - <<'PY'
          import sys
          import unittest

          sys.path.insert(0, "tests")
          modules = [
              "test_broadcaster",
              "test_gitops_manager",
              "test_greenlight",
              "test_json_builder",
              "test_normalizer",
              "test_official_first_policy",
              "test_official_pdf",
              "test_pdf_parser",
              "test_pipeline",
              "test_prc_orchestrator",
              "test_prc_page_sample",
              "test_prc_public_preview_pipeline",
              "test_public_preview",
              "test_public_preview_shards",
              "test_watcher_event_validation",
          ]
          excluded_ids = {
              "test_json_builder.ArrayJsonBuilderTests.test_shards_are_below_configured_size_and_preserve_every_record",
              "test_json_builder.ArrayJsonBuilderTests.test_fallback_manifest_preserves_both_source_identities",
          }

          def flatten(suite):
              for item in suite:
                  yield from flatten(item) if isinstance(item, unittest.TestSuite) else (item,)

          selected = []
          for module in modules:
              loaded = unittest.defaultTestLoader.loadTestsFromName(module)
              selected.extend(test for test in flatten(loaded) if test.id() not in excluded_ids)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Validate committed public datasets and hashes
        run: python tools/validate_public_datasets.py
