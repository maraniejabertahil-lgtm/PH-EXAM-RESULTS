name: Watcher Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - "python-engine/config/sources.json"
      - "python-engine/retrieval/**"
      - "python-engine/tests/**"
      - "tools/extract-prc-pdf.mjs"
      - "watcher-bot/tests/prc-extractor.test.mjs"
      - ".github/workflows/private-prc-extraction.yml"
      - "python-engine/config/prc-sources.json"
  pull_request:
    branches:
      - main
    paths:
      - "watcher-bot/**"
      - ".github/workflows/process-import.yml"
      - ".github/workflows/watcher-ci.yml"
      - "python-engine/config/sources.json"
      - "python-engine/retrieval/**"
      - "python-engine/tests/**"
      - "tools/extract-prc-pdf.mjs"
      - "watcher-bot/tests/prc-extractor.test.mjs"
      - ".github/workflows/private-prc-extraction.yml"
      - "python-engine/config/prc-sources.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check watcher-bot/src/index.js
      - name: Run Watcher automated tests
        working-directory: watcher-bot
        run: npm test
      - name: Run PRC extractor safety tests
        run: node --test watcher-bot/tests/prc-extractor.test.mjs
      - name: Set up Python for public PDF retrieval tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run approved Drive retrieval unit tests
        working-directory: python-engine
        run: PYTHONPATH=retrieval python -m unittest discover -s tests -v
