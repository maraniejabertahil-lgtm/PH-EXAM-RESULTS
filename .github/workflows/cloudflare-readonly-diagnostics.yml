name: Read-only Cloudflare Watcher Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-readonly-diagnostics.yml"
  push:
    branches:
      - main
      - diagnostics/cloudflare-readonly-20261102
      - integration/phase10-monitoring-20261105
    paths:
      - ".github/workflows/cloudflare-readonly-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Confirm credentials exist without displaying them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials are present."
      - name: Verify production KV namespace and PEAK_WEEK key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ebfd9a0e0ac34990883f536cc6d8d2b4
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")
          namespace_status="$(curl -sS -o /tmp/kv-namespace.json -w '%{http_code}' "$api/$KV_NAMESPACE_ID" "${headers[@]}")"
          if [ "$namespace_status" != "200" ]; then
            echo "::error::KV namespace metadata request returned HTTP $namespace_status."
            cat /tmp/kv-namespace.json
            exit 1
          fi
          echo "Production KV namespace metadata is readable (HTTP 200)."
          key_status="$(curl -sS -o /tmp/peak-week-value -w '%{http_code}' "$api/$KV_NAMESPACE_ID/values/PEAK_WEEK" "${headers[@]}")"
          case "$key_status" in
            200)
              value="$(cat /tmp/peak-week-value)"
              case "$value" in
                true|1) echo "PEAK_WEEK=true" ;;
                false|0) echo "PEAK_WEEK=false" ;;
                *) echo "PEAK_WEEK key exists with a non-boolean value; Worker will interpret it as OFF." ;;
              esac
              ;;
            404)
              echo "PEAK_WEEK key is absent (HTTP 404); Worker interprets the missing value as OFF."
              ;;
            *)
              echo "::error::PEAK_WEEK value request returned unexpected HTTP $key_status."
              cat /tmp/peak-week-value
              exit 1
              ;;
          esac
      - name: Verify active production Worker deployment and version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ph-exam-results-watcher/deployments?per_page=5"
          code="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" -o /tmp/worker-deployments.json -w '%{http_code}' "$endpoint")"
          echo "Production Worker deployments API: HTTP $code"
          if [ "$code" = "200" ]; then
            python - <<'PY'
          import json
          with open("/tmp/worker-deployments.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if not payload.get("success"):
              raise SystemExit("Cloudflare did not confirm deployment query success")
          deployments = payload.get("result", {}).get("deployments", [])
          if not deployments:
              raise SystemExit("Cloudflare returned no Worker deployments")
          active = deployments[0]
          print("Latest active deployment:", active.get("id"))
          print("Deployment created:", active.get("created_on"))
          print("Deployment source:", active.get("source"))
          for item in active.get("versions", []):
              print("Traffic version:", item.get("version_id"), "traffic percentage:", item.get("percentage"))
          PY
          else
            echo "::warning::Could not read active deployment list (HTTP $code); compare remains unresolved. No production settings were changed."
          fi
      - name: Verify GitHub dispatch secret binding exists without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ph-exam-results-watcher/secrets/GITHUB_TOKEN"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
          echo "Worker GITHUB_TOKEN secret-binding metadata: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "The Worker GitHub dispatch credential binding exists; its value was not retrieved or displayed."
          else
            echo "::warning::The Worker GitHub dispatch credential binding could not be confirmed (HTTP $code)."
          fi
      - name: Verify deployed production Worker Cron schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/worker-schedules.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ph-exam-results-watcher/schedules")"
          echo "Production Worker schedules API: HTTP $code"
          if [ "$code" = "200" ]; then
            python - <<'PY'
          import json
          with open("/tmp/worker-schedules.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if not payload.get("success"):
              raise SystemExit("Cloudflare did not confirm schedule query success")
          schedules = [item.get("cron") for item in payload.get("result", {}).get("schedules", [])]
          print("Deployed production cron schedules:", schedules)
          if "* * * * *" not in schedules:
              raise SystemExit("Expected one-minute production cron trigger is missing")
          PY
          else
            echo "::warning::The configured API token cannot read Worker schedules; live cron status remains unverified."
          fi
      - name: Check PRC robots policy before enabling article crawling
        run: |
          set -euo pipefail
          code="$(curl -L -sS -A 'Mozilla/5.0 (compatible; PH-EXAM-RESULTS-Diagnostics/1.0)' -o /tmp/prc-robots.txt -w '%{http_code}' 'https://www.prc.gov.ph/robots.txt')"
          echo "PRC robots.txt: HTTP $code"
          if [ "$code" = "200" ]; then
            cat /tmp/prc-robots.txt
          else
            echo "Robots policy could not be retrieved; automated article crawling must remain disabled."
          fi
      - name: Run Peak Week simulation tests
        working-directory: watcher-bot
        run: npm test
      - name: Observe production Worker logs
        working-directory: watcher-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          timeout --kill-after=5s 125s npx --yes wrangler@4.156.2 tail --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Observation window ended normally."
          elif [ "$code" -ne 0 ]; then
            echo "::error::Production Worker tail failed (exit $code)."
            exit "$code"
          fi

# Read-only diagnostic refresh: verify the live Watcher after source registry updates.

