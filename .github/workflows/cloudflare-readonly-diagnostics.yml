name: Read-only Cloudflare Watcher Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-readonly-diagnostics.yml"
  push:
    branches:
      - main
      - diagnostics/cloudflare-readonly-20261102
    paths:
      - ".github/workflows/cloudflare-readonly-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Confirm credentials exist without displaying them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials are present."
      - name: Verify production KV namespace and PEAK_WEEK key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ebfd9a0e0ac34990883f536cc6d8d2b4
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")
          namespace_status="$(curl -sS -o /tmp/kv-namespace.json -w '%{http_code}' "$api/$KV_NAMESPACE_ID" "${headers[@]}")"
          if [ "$namespace_status" != "200" ]; then
            echo "::error::KV namespace metadata request returned HTTP $namespace_status."
            cat /tmp/kv-namespace.json
            exit 1
          fi
          echo "Production KV namespace metadata is readable (HTTP 200)."
          key_status="$(curl -sS -o /tmp/peak-week-value -w '%{http_code}' "$api/$KV_NAMESPACE_ID/values/PEAK_WEEK" "${headers[@]}")"
          case "$key_status" in
            200)
              value="$(cat /tmp/peak-week-value)"
              case "$value" in
                true|1) echo "PEAK_WEEK=true" ;;
                false|0) echo "PEAK_WEEK=false" ;;
                *) echo "PEAK_WEEK key exists with a non-boolean value; Worker will interpret it as OFF." ;;
              esac
              ;;
            404)
              echo "PEAK_WEEK key is absent (HTTP 404); Worker interprets the missing value as OFF."
              ;;
            *)
              echo "::error::PEAK_WEEK value request returned unexpected HTTP $key_status."
              cat /tmp/peak-week-value
              exit 1
              ;;
          esac
      - name: Probe official CSC listing from GitHub runner
        run: |
          set -euo pipefail
          for url in \
            "https://csc.gov.ph/regional-offices/region-v/examination" \
            "https://www.csc.gov.ph/regional-offices/region-v/examination"; do
            code="$(curl -L -sS -A 'Mozilla/5.0 (compatible; PH-EXAM-RESULTS-Diagnostics/1.0)' -o /tmp/csc-page.html -w '%{http_code}' "$url")"
            echo "CSC page GET: $url -> HTTP $code"
            if [ "$code" = "200" ]; then
              grep -Eo 'https://drive\.google\.com/file/d/[A-Za-z0-9_-]+' /tmp/csc-page.html | sort -u | head -10 || true
            fi
          done
      - name: Test optional public Reader proxy for CSC page
        run: |
          set -euo pipefail
          url="https://r.jina.ai/https://csc.gov.ph/regional-offices/region-v/examination"
          code="$(curl -L -sS -o /tmp/csc-reader.txt -w '%{http_code}' "$url")"
          echo "Reader proxy response: HTTP $code"
          if [ "$code" = "200" ]; then
            grep -Eo 'https://drive\.google\.com/file/d/[A-Za-z0-9_-]+' /tmp/csc-reader.txt | sort -u | head -10 || true
            grep -Ei 'RESULTS ARE OUT|List of Passers|Civil Service Examination' /tmp/csc-reader.txt | head -5 || true
          fi
      - name: Test fresh browser-mode Reader retrieval
        run: |
          set -euo pipefail
          url="https://r.jina.ai/https://csc.gov.ph/regional-offices/region-v/examination"
          code="$(curl -L -sS -H 'X-No-Cache: true' -H 'X-Engine: browser' -H 'X-Respond-With: html' -o /tmp/csc-reader-fresh.html -w '%{http_code}' "$url")"
          echo "Fresh browser Reader response: HTTP $code"
          if [ "$code" = "200" ]; then
            grep -Eio 'https://drive\.google\.com/file/d/[A-Za-z0-9_-]+' /tmp/csc-reader-fresh.html | sort -u | head -10 || true
            grep -Ei -A2 -B2 'Professional:|SubProfessional:|Regional List of Passers|RESULTS ARE OUT' /tmp/csc-reader-fresh.html | head -30 || true
          fi
      - name: Test no-cache Reader retrieval without browser engine
        run: |
          set -euo pipefail
          url="https://r.jina.ai/https://csc.gov.ph/regional-offices/region-v/examination"
          code="$(curl -L -sS -H 'X-No-Cache: true' -H 'X-Respond-With: html' -o /tmp/csc-reader-nocache.html -w '%{http_code}' "$url")"
          echo "No-cache Reader response: HTTP $code"
          if [ "$code" = "200" ]; then
            grep -Eio 'https://drive\.google\.com/file/d/[A-Za-z0-9_-]+' /tmp/csc-reader-nocache.html | sort -u | head -10 || true
            grep -Ei -A2 -B2 'Professional:|SubProfessional:|Regional List of Passers|RESULTS ARE OUT' /tmp/csc-reader-nocache.html | head -30 || true
          fi
      - name: Inspect official PRC page HTML from GitHub runner
        run: |
          set -euo pipefail
          index=0
          for url in \
            "https://www.prc.gov.ph/" \
            "https://www.prc.gov.ph/node/9450" \
            "https://www.prc.gov.ph/article/august-and-september-2026-nurses-licensure-examination-results-released-five-5-working-days"; do
            index=$((index + 1))
            file="/tmp/prc-page-$index.html"
            code="$(curl -L -sS -A 'Mozilla/5.0 (compatible; PH-EXAM-RESULTS-Diagnostics/1.0)' -o "$file" -w '%{http_code}' "$url")"
            echo "PRC page GET: $url -> HTTP $code; bytes=$(wc -c < "$file")"
            if [ "$code" = "200" ]; then
              python - "$file" <<'PY'
          import re, sys
          from html import unescape
          content = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for href in re.findall(r'href\\s*=\\s*["\']([^"\']+)["\']', content, re.I):
              href = unescape(href)
              if any(term in href.lower() for term in ("drive.google", "docs.google", ".pdf", "13u_")):
                  print("PRC candidate href:", href[:500])
          for match in re.findall(r'https?://[^\\s"<>]+', content, re.I):
              if any(term in match.lower() for term in ("drive.google", "docs.google", ".pdf", "13u_")):
                  print("PRC candidate text URL:", unescape(match[:500]))
          PY
            fi
          done
      - name: Inspect no-cache Reader JSON metadata and links
        run: |
          set -euo pipefail
          url="https://r.jina.ai/https://csc.gov.ph/regional-offices/region-v/examination"
          code="$(curl -L -sS -H 'X-No-Cache: true' -H 'Accept: application/json' -o /tmp/csc-reader.json -w '%{http_code}' "$url")"
          echo "Reader JSON response: HTTP $code"
          if [ "$code" = "200" ]; then
            python - <<'PY'
          import json
          with open("/tmp/csc-reader.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          data = payload.get("data", {}) if isinstance(payload, dict) else {}
          print("Reader URL:", data.get("url"))
          print("Reader title:", data.get("title"))
          content = data.get("content", "")
          print("Reader content bytes:", len(content))
          print("Reader content preview:", content[:2500])
          links = data.get("links", [])
          if isinstance(links, list):
              for item in links:
                  value = item.get("url", "") if isinstance(item, dict) else str(item)
                  if any(host in value.lower() for host in ("drive.google.com", "bit.ly", "tinyurl.com")):
                      print("Reader candidate link:", value)
          PY
          fi
      - name: Run Peak Week simulation tests
        working-directory: watcher-bot
        run: npm test
      - name: Observe production Worker logs
        working-directory: watcher-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          timeout 75s npx --yes wrangler@4.156.2 tail --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Observation window ended normally."
          elif [ "$code" -ne 0 ]; then
            echo "::error::Production Worker tail failed (exit $code)."
            exit "$code"
          fi

# Read-only diagnostic refresh: verify the live Watcher after source registry updates.

# Read-only diagnostic refresh: test the canonical CSC hostname.
