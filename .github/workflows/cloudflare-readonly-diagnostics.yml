name: Read-only Cloudflare Watcher Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Confirm credentials exist without displaying them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials are present."
      - name: Read production Peak Week flag
        working-directory: watcher-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.2 kv key get --binding=PEAK_WEEK PEAK_WEEK --remote
      - name: Observe production Worker logs
        working-directory: watcher-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          timeout 75s npx --yes wrangler@4.156.2 tail --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Observation window ended normally."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Tail unavailable; token may lack observability permission (exit $code)."
          fi
