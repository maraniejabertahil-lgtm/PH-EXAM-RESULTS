name: Temporary Private NLE Extraction (No Publication)

on:
  push:
    branches:
      - tmp/private-nle-2026-09-extraction
    paths:
      - ".github/workflows/tmp-private-nle-extraction.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp/private-nle-2026-09-extraction
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
          npm install --no-save --no-package-lock pdfjs-dist@4.10.38
      - name: Add the official September 2026 NLE source to an ephemeral registry
        run: |
          python - <<'PY'
          import json
          p='python-engine/config/prc-sources.json'
          d=json.load(open(p))
          d['sources'].append({
            'id':'PRC-NLE-2026-08-09',
            'authority':'PRC','exam':'NLE','year':2026,
            'source_type':'official','authorized':True,'enabled':True,
            'announcement_url':'https://www.prc.gov.ph/article/august-and-september-2026-nurses-licensure-examination-results-released-five-5-working-days',
            'drive_file_id':'13u_FOsF3DxS7RvMOdMqsg4Q1HF2rKtvU',
            'expected_passers':28652
          })
          json.dump(d,open('/tmp/prc-sources.json','w'))
          PY
      - name: Acquire and extract official PRC PDF
        env:
          SOURCE_ID: PRC-NLE-2026-08-09
          SOURCE_REGISTRY: /tmp/prc-sources.json
          OUTPUT_DIR: private-nle-extraction
        run: node tools/extract-prc-pdf.mjs
      - name: Upload private extraction text and report only
        uses: actions/upload-artifact@v4
        with:
          name: private-nle-extraction-${{ github.run_id }}
          path: |
            private-nle-extraction/extraction-report.json
            private-nle-extraction/PRC-NLE-2026-08-09-embedded.txt
            private-nle-extraction/PRC-NLE-2026-08-09-ocr.txt
          if-no-files-found: error
          retention-days: 1
