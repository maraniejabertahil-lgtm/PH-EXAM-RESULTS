name: PRC Official LEPT Elementary Extraction Trial

on:
  push:
    branches:
      - test/prc-official-lept-elementary-2026
    paths:
      - "tools/prc-official-lept-elementary-2026.py"
      - ".github/workflows/prc-official-lept-elementary-2026.yml"

permissions:
  contents: read

jobs:
  official-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python PDF parser
        run: python -m pip install pdfplumber
      - name: Run official-only extraction
        run: python tools/prc-official-lept-elementary-2026.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prc-official-lept-elementary-2026-evidence
          path: official-prc-evidence/
          if-no-files-found: warn
          retention-days: 7
