name: PRC Official LEPT Elementary Extraction Trial

on:
  push:
    branches:
      - test/prc-official-lept-elementary-2026
      - integration/prc-public-preview-python-engine
    paths:
      - "tools/prc-official-lept-elementary-2026.py"
      - "tools/prototypes/prc_preview_ocr_probe.py"
      - "tools/run_prc_public_preview_python_engine.py"
      - "python-engine/**"
      - ".github/workflows/prc-official-lept-elementary-2026.yml"

concurrency:
  group: prc-official-lept-elementary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  official-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser, parsers, and OCR alternative
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r python-engine/requirements.txt playwright pymupdf pdfplumber
          python -m playwright install --with-deps chromium
      - name: Run official-only extraction
        run: python tools/prc-official-lept-elementary-2026.py
      - name: Capture official source pages for visual review
        if: always()
        run: python tools/prototypes/prc_preview_ocr_probe.py
      - name: Run Python Engine capture verification, Greenlight, and dataset generation
        run: python tools/run_prc_public_preview_python_engine.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prc-official-lept-elementary-2026-evidence
          path: |
            official-prc-evidence/
            official-prc-visual-check/
          if-no-files-found: warn
          retention-days: 7
