name: Python Engine Tests

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check browser JavaScript module syntax
        run: |
          set -euo pipefail
          for file in public/assets/js/app.js public/assets/js/loader.js public/assets/js/storage.js public/assets/js/search.js; do
            node --input-type=module --check < "$file"
          done
