name: Migrate Private Activity Monitor D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify D1 credentials
        env:
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_D1_API_TOKEN" || { echo "::error::Missing CF_D1_API_TOKEN."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CF_ACCOUNT_ID."; exit 1; }
          test -n "$CF_D1_DATABASE_ID" || { echo "::error::Missing CF_D1_DATABASE_ID."; exit 1; }
      - name: Apply idempotent D1 schema using the Cloudflare REST API
        working-directory: python-engine/database
        env:
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python d1_client.py migrate
