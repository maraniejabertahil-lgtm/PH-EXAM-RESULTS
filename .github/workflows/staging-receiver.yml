name: Staging - Validate Detected Source

on:
  repository_dispatch:
    types:
      - staging-source-detected

permissions:
  contents: read

jobs:
  validate-staging-event:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'staging-source-detected'
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the staging source registry
        uses: actions/checkout@v5
        with:
          ref: implementation/two-public-pages
          path: staging-registry
          sparse-checkout: |
            python-engine/config/sources.json

      - name: Validate event against the staging registry (no acquisition or processing)
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          if not isinstance(payload, dict):
              raise SystemExit("Rejected: event payload must be an object.")

          required = ("source_id", "authority", "exam", "detected_url")
          if any(not isinstance(payload.get(key), str) or not payload[key].strip() for key in required):
              raise SystemExit("Rejected: required source-detection fields are missing.")
          if payload["authority"] not in {"PRC", "CSC"}:
              raise SystemExit("Rejected: unsupported examination authority.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,59}", payload["source_id"]):
              raise SystemExit("Rejected: invalid source ID.")

          registry_path = Path("staging-registry/python-engine/config/sources.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not isinstance(registry, dict) or not isinstance(registry.get("sources"), list):
              raise SystemExit("Rejected: staging registry must contain a sources array.")

          matches = [
              item for item in registry["sources"]
              if isinstance(item, dict) and item.get("id") == payload["source_id"]
          ]
          if len(matches) != 1:
              raise SystemExit("Rejected: source ID must match exactly one staging registry entry.")
          source = matches[0]

          if source.get("enabled") is not True:
              raise SystemExit("Rejected: staging source is not enabled.")
          authorized = (
              source.get("source_type") == "official" and source.get("authorized") is True
          ) or (
              source.get("source_type") == "verified_third_party"
              and source.get("verified_by_owner") is True
          )
          if not authorized:
              raise SystemExit("Rejected: staging source is not owner-authorized or owner-verified.")
          if source.get("authority") != payload["authority"] or source.get("exam") != payload["exam"]:
              raise SystemExit("Rejected: event metadata does not match the staging registry.")
          if payload.get("source_type") and payload["source_type"] != source.get("source_type"):
              raise SystemExit("Rejected: source type does not match the staging registry.")
          if source.get("file_format") != "pdf":
              raise SystemExit("Rejected: staging source is not configured for PDF files.")

          detected = urlsplit(payload["detected_url"])
          if (
              detected.scheme != "https" or not detected.hostname
              or detected.username or detected.password
          ):
              raise SystemExit("Rejected: detected URL must be HTTPS and contain no credentials.")

          if detected.hostname.lower() == "drive.google.com":
              query = parse_qs(detected.query)
              file_id = query.get("id", [""])[0]
              allowed_ids = source.get("drive_file_ids", [])
              if (
                  detected.path != "/uc"
                  or query.get("export") != ["download"]
                  or not isinstance(allowed_ids, list)
                  or file_id not in allowed_ids
              ):
                  raise SystemExit("Rejected: Google Drive URL is not an exact owner-approved file ID.")
          else:
              approved = urlsplit(source.get("url", ""))
              def origin(parts):
                  try:
                      return (
                          parts.scheme,
                          (parts.hostname or "").lower(),
                          parts.port or 443,
                      )
                  except ValueError:
                      return None
              if origin(detected) is None or origin(detected) != origin(approved) or approved.scheme != "https":
                  raise SystemExit("Rejected: detected PDF is outside the approved HTTPS source origin.")
              if not (
                  detected.path.lower().endswith(".pdf")
                  or str(payload.get("content_type", "")).lower() == "application/pdf"
              ):
                  raise SystemExit("Rejected: detected resource is not identified as a PDF.")

          report = {
              "status": "validated_staging_event_manual_review_required",
              "source_id": source["id"],
              "authority": source["authority"],
              "exam": source["exam"],
              "detected_url": payload["detected_url"],
              "manual_review_required": True,
              "validation_only": True,
              "pdf_acquired": False,
              "extraction_performed": False,
              "published": False,
          }
          Path("staging-validation-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Staging Watcher event validated\n\n"
                  f"- Source: `{source['id']}`\n"
                  f"- Authority / examination: `{source['authority']} / {source['exam']}`\n"
                  "- Validation only: no PDF acquisition, extraction, or publication.\n"
              )
          print("Staging event validated against the staging registry.")
          print("No PDF was downloaded, extracted, or published.")
          PY

      - name: Upload staging validation report
        if: always() && hashFiles('staging-validation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-source-validation-${{ github.run_id }}
          path: staging-validation-report.json
          if-no-files-found: error
          retention-days: 7
