name = "ph-exam-results-watcher"
main = "src/index.js"
compatibility_date = "2026-11-02"
workers_dev = true

[observability]
enabled = true

[vars]
GITHUB_REPOSITORY = "maraniejabertahil-lgtm/PH-EXAM-RESULTS"
GITHUB_SOURCE_REF = "main"
GITHUB_SOURCE_PATH = "python-engine/config/sources.json"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "PEAK_WEEK"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"
