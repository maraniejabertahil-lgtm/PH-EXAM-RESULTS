name = "ph-exam-results-watcher"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
GITHUB_REPOSITORY = "maraniejabertahil-lgtm/PH-EXAM-RESULTS"
GITHUB_SOURCE_REF = "main"
GITHUB_SOURCE_PATH = "python-engine/config/sources.json"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "PEAK_WEEK"
id = "ebfd9a0e0ac34990883f536cc6d8d2b4"

# Worker Preview base configuration.
# Previews use the staging registry and staging KV, never Production KV.
[previews.vars]
GITHUB_REPOSITORY = "maraniejabertahil-lgtm/PH-EXAM-RESULTS"
GITHUB_SOURCE_REF = "implementation/two-public-pages"
GITHUB_SOURCE_PATH = "python-engine/config/sources.json"
GITHUB_EVENT_TYPE = "staging-source-detected"

[[previews.kv_namespaces]]
binding = "PEAK_WEEK"
id = "cc91a5e8fdfa426f9f9f3b19218e232b"

# Test Mode event ingestion is opt-in and separate from production dispatch.
# Configure TEST_MODE_EVENT_INGEST_URL as a non-secret Worker variable and
# TEST_MODE_EVENT_INGEST_TOKEN as a Worker secret only after the Pages endpoint
# and dedicated Test Mode D1 binding are ready. Never commit the token.
