name = "ph-exam-results-watcher"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
GITHUB_REPOSITORY = "maraniejabertahil-lgtm/PH-EXAM-RESULTS"
GITHUB_SOURCE_REF = "main"
GITHUB_SOURCE_PATH = "python-engine/config/sources.json"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "PEAK_WEEK"
id = "ebfd9a0e0ac34990883f536cc6d8d2b4"

[env.staging]
name = "ph-exam-results-watcher-staging"
workers_dev = true

[env.staging.vars]
GITHUB_REPOSITORY = "maraniejabertahil-lgtm/PH-EXAM-RESULTS"
GITHUB_SOURCE_REF = "implementation/two-public-pages"
GITHUB_SOURCE_PATH = "python-engine/config/sources.json"


[[env.staging.kv_namespaces]]
binding = "PEAK_WEEK"
id = "cc91a5e8fdfa426f9f9f3b19218e232b"
